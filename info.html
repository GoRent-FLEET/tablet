<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PilotTablet has moved</title>
<script>
// Old address gorent-fleet.github.io/tablet/… → new gorent-fleet.github.io/pilottablet/…
// Keeps the page name, ?query and #fragment (contract / report links carry the document in #).
(function(){var l=location,p=l.pathname.replace(/^\/tablet(\/|$)/,'/pilottablet/');
 if(p.indexOf('/pilottablet/')!==0)p='/pilottablet/';
 l.replace(l.protocol+'//'+l.host+p+l.search+l.hash);})();
</script>
<style>body{font-family:system-ui,sans-serif;text-align:center;padding:40px 16px;color:#333}a{color:#e8730c;font-weight:700}</style>
</head><body>
<p>PilotTablet has moved to a new address.</p>
<p><a id="go" href="https://gorent-fleet.github.io/pilottablet/">Open PilotTablet</a></p>
</body></html>
