function getPA(key){
  if(key==='co.prepPhotos')return co.prepPhotos;
  if(key==='co.dmgPhotos')return co.dmgPhotos;
  if(key==='ci.dmgPhotos')return(ci.dmgPhotos=ci.dmgPhotos||[]);
  return[];
}
function photoHTML(key,title,sub,max){
  const arr=getPA(key);const safe=key.replace(/[^a-z]/gi,'_');
  return `<div class="photo-sec">
    <div class="photo-title">${title}</div>
    <div class="photo-sub">${sub}</div>
    <div class="photo-grid">
      ${arr.map((src,i)=>`<div class="p-thumb"><img src="${src}"><button class="p-del" onclick="delPhoto('${key}',${i})">✕</button></div>`).join('')}
      ${arr.length<max?`<div class="p-add" onclick="document.getElementById('fi-${safe}').click()">
        <input type="file" id="fi-${safe}" accept="image/*" capture="environment" multiple onchange="handlePhotos(event,'${key}')">
        <div class="p-add-ico">📷</div><div class="p-add-lbl">${arr.length?'Add more':'Take photo'}</div>
      </div>`:''}
    </div>
    <div style="font-size:10px;color:var(--g5);margin-top:5px;text-align:center">${arr.length}/${max}</div>
  </div>`;
}
function handlePhotos(e,key){
  const arr=getPA(key);const files=Array.from(e.target.files);
  const toAdd=Math.min(files.length,8-arr.length);let loaded=0;
  for(let i=0;i<toAdd;i++){const r=new FileReader();r.onload=ev=>{arr.push(ev.target.result);loaded++;if(loaded===toAdd)redraw();};r.readAsDataURL(files[i]);}
}
function delPhoto(key,i){const arr=getPA(key);arr.splice(i,1);redraw();}
function redraw(){
  if(document.getElementById('page-co').classList.contains('on'))drawCO();
  else drawCI();
}
async function uploadPhotos(arr,fn,client,stage){
  if(!arr?.length)return;
  const cln=(client||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
  const date=new Date().toISOString().split('T')[0];
  banner(`Uploading ${arr.length} photo(s) — ${fn}/${client}/${stage}`);
  for(let i=0;i<arr.length;i++){
    if(arr[i].startsWith('http'))continue;
    const blob=await(await fetch(arr[i])).blob();
    const path=`${fn}/${cln}/${date}/${stage}/${Date.now()}_${i}.jpg`;
    const{error}=await SB.storage.from('vehicle-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(!error){const{data:u}=SB.storage.from('vehicle-photos').getPublicUrl(path);arr[i]=u.publicUrl;}
  }
  hideBanner();
}
async function compressImg(file,maxW,q){
  return new Promise(res=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(maxW/img.width,1);const cv=document.createElement('canvas');
      cv.width=img.width*r;cv.height=img.height*r;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(b=>res(b),'image/jpeg',q);URL.revokeObjectURL(url);};
    img.src=url;
  });
}
function showImg(src){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:flex;align-items:center;justify-content:center;';
  m.onclick=()=>m.remove();
  m.innerHTML=`<img src="${src}" style="max-width:95%;max-height:90vh;object-fit:contain;border-radius:8px">`;
  document.body.appendChild(m);
}

function buildIG(v){
  const el=document.getElementById('ins-g-'+v);if(!el)return;
  const[cols,rows]=IGR[v][isize];el.style.gridTemplateColumns=`repeat(${cols},1fr)`;el.style.gridTemplateRows=`repeat(${rows},1fr)`;el.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cell=document.createElement('div');cell.className='ins-cell';cell.dataset.r=r;cell.dataset.c=c;
    const cur=imarks[v][isize][r+','+c]||null;if(cur)cell.classList.add(cur);
    cell.addEventListener('mousedown',e=>{e.preventDefault();window._id=true;window._ip=imarks[v][isize][r+','+c]!==itool;iCT(cell,v,r,c);});
    cell.addEventListener('mouseover',()=>{if(window._id&&window._ip)iCP(cell,v,r,c);});
    cell.addEventListener('touchstart',e=>{e.preventDefault();iCT(cell,v,r,c);},{passive:false});
    cell.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const e2=document.elementFromPoint(t.clientX,t.clientY);if(e2?.classList.contains('ins-cell'))VIEWS.forEach(vv=>{if(document.getElementById('ins-g-'+vv)===e2.parentElement)iCP(e2,vv,+e2.dataset.r,+e2.dataset.c);});},{passive:false});
    el.appendChild(cell);
  }
}
document.addEventListener('mouseup',()=>window._id=false);document.addEventListener('mousedown',()=>window._id=true);
function iCT(cell,v,r,c){const key=r+','+c;const cur=imarks[v][isize][key]||null;iundo={v,sz:isize,key,prev:cur};eU();if(cur===itool){cell.classList.remove(cur);delete imarks[v][isize][key];}else{if(cur)cell.classList.remove(cur);cell.classList.add(itool);imarks[v][isize][key]=itool;}renderIS();}
function iCP(cell,v,r,c){const key=r+','+c;const cur=imarks[v][isize][key]||null;if(cur===itool)return;iundo={v,sz:isize,key,prev:cur};eU();if(cur)cell.classList.remove(cur);cell.classList.add(itool);imarks[v][isize][key]=itool;renderIS();}
function eU(){const b=document.getElementById('ins-undo');if(b){b.disabled=false;b.style.opacity='1';}}
function setIT(t,btn){itool=t;document.querySelectorAll('.ins-t').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function setIS(s){isize=s;document.querySelectorAll('.ins-szb').forEach(b=>b.classList.remove('on'));document.getElementById('isz-'+s)?.classList.add('on');VIEWS.forEach(v=>buildIG(v));}
function insUndo(){if(!iundo)return;const la=iundo;iundo=null;const b=document.getElementById('ins-undo');if(b){b.disabled=true;b.style.opacity='.4';}if(la.prev===null)delete imarks[la.v][la.sz][la.key];else imarks[la.v][la.sz][la.key]=la.prev;if(la.sz===isize){const p=la.key.split(',');const g=document.getElementById('ins-g-'+la.v);if(g){const[c]=IGR[la.v][isize];const cell=g.children[+p[0]*c+ +p[1]];if(cell){cell.classList.remove('sc','de','pr');if(la.prev)cell.classList.add(la.prev);}}}renderIS();}
function insClearV(v){imarks[v][isize]={};buildIG(v);renderIS();}
function insClear(){VIEWS.forEach(v=>{imarks[v]={S:{},M:{},L:{}};buildIG(v);});renderIS();}
function renderIS(){const byVT={};let tot=0;VIEWS.forEach(v=>{const m=imarks[v][isize];const tp={};Object.values(m).forEach(t=>{tp[t]=true;});if(Object.keys(tp).length)byVT[v]=Object.keys(tp);tot+=Object.keys(m).length;});const cnt=document.getElementById('ins-cnt');if(cnt)cnt.textContent=tot+' block'+(tot!==1?'s':'');const tg=document.getElementById('ins-tags');if(!tg)return;if(!Object.keys(byVT).length){tg.innerHTML='<span class="ins-emsg">Tap vehicle photos above to mark damage</span>';return;}let h='';Object.keys(byVT).forEach(v=>{byVT[v].forEach(t=>{const c=Object.values(imarks[v][isize]).filter(x=>x===t).length;h+=`<div class="ins-tag ${t}">${VNAMES[v]} — ${ILBL[t]} (${c})</div>`;});});tg.innerHTML=h;}
function getDmgData(){const out=[];VIEWS.forEach(v=>{const m=imarks[v][isize];if(!Object.keys(m).length)return;const cells=Object.keys(m).map(k=>{const[r,c]=k.split(',');return{r:+r,c:+c,t:m[k]};});out.push({view:v,view_name:VNAMES[v],size:isize,cells,types:[...new Set(cells.map(c=>c.t))]});});return out;}

function renderRetGroups(){
  return RET_GROUPS.map((grp,gi)=>{
    const sts=grp.items.map(i=>retSt[i]||'ok');

}

function initSig(id){const cv=document.getElementById(id);if(!cv||sigs[id])return;cv.width=cv.offsetWidth||540;const ctx=cv.getContext('2d');ctx.strokeStyle='#3ddc84';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';sigs[id]={ctx,drawing:false,hasData:false};const pos=(e,t)=>{const r=cv.getBoundingClientRect();return t?{x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)}:{x:e.offsetX*(cv.width/cv.offsetWidth),y:e.offsetY*(cv.height/cv.offsetHeight)};};const start=(e,p)=>{e.preventDefault();sigs[id].drawing=true;sigs[id].hasData=true;ctx.beginPath();ctx.moveTo(p.x,p.y);};const move=(e,p)=>{if(!sigs[id].drawing)return;ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);};const stop=()=>{if(sigs[id])sigs[id].drawing=false;};cv.addEventListener('mousedown',e=>start(e,pos(e)));cv.addEventListener('mousemove',e=>{if(sigs[id]?.drawing)move(e,pos(e));});cv.addEventListener('mouseup',stop);cv.addEventListener('mouseleave',stop);cv.addEventListener('touchstart',e=>start(e,pos(e,e.touches[0])),{passive:false});cv.addEventListener('touchmove',e=>move(e,pos(e,e.touches[0])),{passive:false});cv.addEventListener('touchend',stop,{passive:false});}
function clrSig(id){const cv=document.getElementById(id);if(!cv)return;const s=sigs[id];if(s){s.ctx.clearRect(0,0,cv.width,cv.height);s.hasData=false;}delete sigs[id];}
function hasSig(id){return!!(sigs[id]?.hasData);}
function getSig(id){return document.getElementById(id)?.toDataURL('image/png')||'';}
