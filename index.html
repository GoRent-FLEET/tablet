<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071a0f">
<title>Go Rent 4×4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f172a;--g0:#020812;--g1:#0f1a2e;--g2:#1a2740;--g3:#253550;--g4:#3a4f6a;--g5:#5a7090;--g6:#8aa0b8;--tx:#dde8f5;
  --gr:#0a2e1a;--gb:#145c30;--se:#3ddc84;--sg:#071a0f;
  --bl:#4a9eff;--bs:#0d2a50;--be:#93c5fd;
  --re:#f05050;--rg:#200a0a;--rl:#ffaaaa;
  --am:#f5a623;--ag:#201000;--al:#ffd080;
  --pu:#9d7af5;--ps:#160d35;
  --r:12px;--rs:8px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;-webkit-user-select:none;user-select:none;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(240,80,80,.4);}50%{opacity:.9;box-shadow:0 0 0 6px rgba(240,80,80,0);}}

/* NAV */
.nav{background:#071a0f;border-bottom:2px solid var(--gb);display:flex;align-items:center;padding:0 10px;height:56px;flex-shrink:0;gap:3px;overflow-x:auto;}
.logo{font-size:16px;font-weight:800;color:#fff;margin-right:10px;letter-spacing:-.5px;white-space:nowrap;}
.logo span{color:var(--se);}
.nb{padding:8px 10px;border-radius:8px;font-size:11px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:transparent;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.nb.on{background:rgba(61,220,132,.12);color:var(--se);border:1px solid rgba(61,220,132,.3);}

/* PAGES */
.page{display:none;flex-direction:column;height:calc(100vh - 56px);overflow:hidden;}
.page.on{display:flex;}
.scroll{flex:1;overflow-y:auto;padding:14px;}

/* OVERVIEW */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.ov-stat{background:var(--g1);border:1px solid var(--g2);border-radius:var(--r);padding:14px 10px;text-align:center;}
.ov-n{font-size:26px;font-weight:800;line-height:1;}
.ov-l{font-size:10px;color:var(--g5);margin-top:4px;text-transform:uppercase;letter-spacing:.4px;}
.vc{background:var(--g1);border:2px solid var(--g2);border-radius:var(--r);padding:12px;margin-bottom:7px;cursor:pointer;transition:all .15s;}
.vc:active{opacity:.8;transform:scale(.98);}
.vc.blk{border-color:var(--re);}
.vc.ret:hover{border-color:var(--bl);}
.vc:not(.blk):hover{border-color:var(--gb);}
.vc-fn{font-size:16px;font-weight:800;color:var(--tx);}
.vc-reg{font-size:11px;color:var(--g5);margin-left:6px;font-weight:400;}
.vc-cl{font-size:13px;color:var(--tx);margin-top:3px;}
.vc-meta{font-size:10px;color:var(--g5);margin-top:2px;}

/* FLOW */
.fhdr{background:var(--gr);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;border-left:4px solid var(--se);}
.fhdr-fn{font-size:20px;font-weight:800;color:#fff;}
.fhdr-fn span{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);margin-left:8px;}
.fhdr-cl{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;}

/* STEP TABS — 5 */
.stg-bar{display:grid;gap:3px;margin-bottom:14px;}
.stg-bar.s5{grid-template-columns:repeat(5,1fr);}
.stg-bar.s2{grid-template-columns:1fr 1fr;}
.stg-bar.s3{grid-template-columns:1fr 1fr 1fr;}
.stg{padding:9px 4px;text-align:center;font-size:9px;font-weight:700;color:var(--g5);cursor:pointer;background:var(--g1);border:2px solid var(--g2);border-radius:var(--rs);transition:all .15s;}
.stg.done{border-color:var(--gb);background:var(--sg);color:var(--se);}
.stg.active{border-color:var(--pu);background:var(--ps);color:#c4b5fd;}
.stg.locked{opacity:.3;cursor:not-allowed;}

/* STEP INTRO */
.step-intro{display:flex;align-items:center;gap:14px;background:var(--g2);border-radius:var(--r);padding:13px 16px;margin-bottom:12px;border-left:4px solid var(--se);}
.step-ico{font-size:38px;flex-shrink:0;}
.step-title{font-size:15px;font-weight:800;color:var(--tx);}
.step-sub{font-size:11px;color:var(--g5);margin-top:3px;line-height:1.5;}

/* CHECK ITEMS */
.chk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.ci{display:grid;grid-template-columns:46px 1fr 40px;align-items:center;gap:10px;padding:13px 14px;border-radius:var(--r);border:2px solid var(--g2);background:var(--g1);cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.ci:active{transform:scale(.98);}
.ci.ok{border-color:var(--se);background:var(--sg);}
.ci.prob{border-color:var(--re);background:var(--rg);}
.ci-icon{display:flex;align-items:center;justify-content:center;}
.ci-lbl{font-size:14px;font-weight:700;color:var(--g6);}
.ci.ok .ci-lbl{color:var(--se);}
.ci.prob .ci-lbl{color:var(--rl);}
.ci-det{font-size:10px;color:var(--g4);margin-top:2px;line-height:1.4;}
.ci.ok .ci-det{color:var(--gb);}

/* PROGRESS */
.prog-wrap{margin-bottom:12px;}
.prog-bar{height:10px;background:var(--g2);border-radius:5px;overflow:hidden;margin-bottom:6px;}
.prog-fill{height:100%;border-radius:5px;transition:width .3s;background:var(--se);}
.prog-lbl{font-size:12px;color:var(--g5);display:flex;align-items:center;gap:8px;}
.prog-n{font-size:16px;font-weight:800;color:var(--se);}

/* WHO */
.who-box{background:var(--g0);border:2px solid var(--am);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.who-lbl{font-size:12px;font-weight:700;color:var(--al);margin-bottom:8px;}
select{width:100%;padding:12px 14px;background:var(--g1);border:2px solid var(--g3);border-radius:var(--rs);color:var(--tx);font-size:15px;font-family:var(--font);color-scheme:dark;}
select:focus{outline:none;border-color:var(--se);}

/* FUEL */
.fuel-row{background:var(--g0);border:2px solid var(--am);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.fuel-lbl{font-size:12px;font-weight:700;color:var(--al);margin-bottom:8px;}
.fuel-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.fbtn{padding:10px 4px;border-radius:var(--rs);border:2px solid var(--g3);background:var(--g1);color:var(--g5);font-size:12px;font-weight:700;cursor:pointer;text-align:center;}
.fbtn.on{border-color:var(--se);background:var(--sg);color:var(--se);}

/* FORMS */
.fi{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fi label{font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.4px;}
input,textarea{width:100%;padding:12px 14px;background:var(--g0);border:2px solid var(--g3);border-radius:var(--rs);color:var(--tx);font-size:14px;font-family:var(--font);}
input:focus,textarea:focus{outline:none;border-color:var(--se);}
input::placeholder,textarea::placeholder{color:var(--g4);}
textarea{resize:vertical;min-height:60px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* LIABILITY / SIGN */
.liab{background:#180505;border:2px solid var(--re);border-radius:var(--r);padding:14px;margin-bottom:12px;font-size:12px;color:var(--rl);line-height:1.6;}
.liab strong{color:#fff;font-size:14px;}
.sig-area{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);overflow:hidden;margin:8px 0;}
.sig-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--g1);border-bottom:1px solid var(--g2);}
.sig-lbl{font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;}
.sig-clr{font-size:10px;color:var(--g4);cursor:pointer;padding:3px 8px;border-radius:4px;}
.sig-clr:hover{color:var(--re);}
.sig-cv{display:block;width:100%;height:90px;cursor:crosshair;touch-action:none;}
.signed{display:flex;align-items:center;gap:10px;background:var(--sg);border:2px solid var(--gb);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:18px;}
.signed-name{font-size:14px;font-weight:700;color:var(--se);}
.signed-time{font-size:10px;color:var(--gb);margin-left:auto;}

/* ALERTS */
.al{padding:12px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;border-left:4px solid;line-height:1.5;}
.al.ok{background:var(--sg);border-color:var(--se);color:var(--se);}
.al.warn{background:var(--rg);border-color:var(--re);color:var(--rl);}
.al.info{background:var(--ag);border-color:var(--am);color:var(--al);}
.al.blue{background:var(--bs);border-color:var(--bl);color:var(--be);}

/* BUTTONS */
.btn{padding:14px 18px;border-radius:var(--r);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:var(--font);transition:all .12s;width:100%;margin-top:8px;}
.btn.g{background:var(--se);color:#052010;}
.btn.g:hover{background:#5afa9a;}
.btn.s{background:transparent;border:2px solid var(--g3);color:var(--g6);}
.btn.r{background:#c0392b;color:#fff;}
.btn-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--g2);}
.btn-row .btn{margin-top:0;}

/* INFO */
.info-item{background:var(--g1);border:1px solid var(--g2);border-radius:var(--rs);padding:10px 12px;}
.info-lbl{font-size:9px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.4px;}
.info-val{font-size:14px;font-weight:700;color:var(--tx);margin-top:3px;}

/* RETURN EQUIPMENT */
.ret-grp{border:2px solid var(--g2);border-radius:var(--r);padding:13px;margin-bottom:8px;background:var(--g1);}
.ret-grp.ok{border-color:var(--se);background:var(--sg);}
.ret-grp.dmg{border-color:var(--am);background:var(--ag);}
.ret-grp.miss{border-color:var(--re);background:var(--rg);}
.ret-grp-name{font-size:14px;font-weight:800;margin-bottom:3px;}
.ret-grp.ok .ret-grp-name{color:var(--se);}
.ret-grp.dmg .ret-grp-name{color:var(--al);}
.ret-grp.miss .ret-grp-name{color:var(--rl);}
.ret-grp-items{font-size:10px;color:var(--g5);margin-bottom:10px;line-height:1.5;}
.ret-grp.ok .ret-grp-items{color:var(--gb);}
.ret-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.rbtn{padding:10px 4px;border-radius:var(--rs);border:2px solid var(--g3);background:var(--g0);color:var(--g5);font-size:11px;font-weight:800;cursor:pointer;text-align:center;}
.rbtn:active{transform:scale(.95);}
.rbtn.ok-on{border-color:var(--se);background:var(--sg);color:var(--se);}
.rbtn.dmg-on{border-color:var(--am);background:var(--ag);color:var(--al);}
.rbtn.miss-on{border-color:var(--re);background:var(--rg);color:var(--rl);}

/* PHOTOS */
.photo-sec{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);padding:13px;margin-bottom:12px;}
.photo-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.photo-sub{font-size:10px;color:var(--g5);margin-bottom:10px;line-height:1.4;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.p-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--g2);}
.p-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.p-del{position:absolute;top:4px;right:4px;background:rgba(240,80,80,.9);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.p-add{aspect-ratio:1;border-radius:8px;border:2px dashed var(--g4);background:var(--g1);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:5px;}
.p-add:hover{border-color:var(--se);background:var(--sg);}
.p-add-ico{font-size:24px;}
.p-add-lbl{font-size:9px;font-weight:700;color:var(--g5);text-transform:uppercase;}
.p-add:hover .p-add-lbl{color:var(--se);}
input[type=file]{display:none;}

/* DOC CAPTURE */
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.doc-slot{border:2px dashed var(--g3);border-radius:var(--r);aspect-ratio:1.6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--g0);position:relative;overflow:hidden;gap:6px;transition:all .15s;}
.doc-slot:hover{border-color:var(--se);}
.doc-slot.captured{border-color:var(--se);border-style:solid;}
.doc-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.doc-slot-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.doc-slot-ico{font-size:26px;}
.doc-slot-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.4px;text-align:center;padding:0 8px;}
.doc-slot-sub{font-size:9px;color:rgba(255,255,255,.5);text-align:center;padding:0 8px;}
.doc-slot.captured .doc-slot-lbl{color:var(--se);}

/* SUMMARY */
.sum-box{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);padding:13px;margin-bottom:12px;}
.sum-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;}
.sum-row{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--g2);font-size:12px;}
.sum-row:last-child{border-bottom:none;}
.sum-lbl{font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.3px;padding-top:1px;}
.sum-val{color:var(--g6);}
.sum-val.ok{color:var(--se);}
.sum-val.warn{color:var(--rl);font-weight:700;}

/* ACCOUNTABILITY */
.done{text-align:center;padding:30px 20px;}
.done-ico{font-size:56px;margin-bottom:12px;}
.done-title{font-size:20px;font-weight:800;color:var(--se);margin-bottom:5px;}
.done-sub{font-size:13px;color:var(--g5);line-height:1.5;}
.acc{border:2px solid var(--g2);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
.acc-hdr{background:var(--g2);padding:10px 14px;font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;}
.acc-row{padding:11px 14px;border-bottom:1px solid var(--g2);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;}
.acc-row:last-child{border-bottom:none;}
.acc-row.good{background:rgba(61,220,132,.04);}
.acc-row.bad{background:rgba(240,80,80,.07);}
.acc-ico{font-size:20px;}
.acc-name{font-size:13px;font-weight:700;}
.acc-row.good .acc-name{color:var(--se);}
.acc-row.bad .acc-name{color:var(--rl);}
.acc-detail{font-size:10px;color:var(--g5);margin-top:2px;line-height:1.5;}
.acc-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.acc-badge.ok{background:var(--sg);color:var(--se);}
.acc-badge.warn{background:var(--rg);color:var(--rl);}

/* INSPECTOR */
.ins-wrap{background:var(--g0);border-radius:var(--r);overflow:hidden;border:1px solid var(--g2);margin-bottom:12px;}
.ins-tb{background:#071a0f;padding:8px 10px;display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--gb);overflow-x:auto;}
.ins-tl{color:rgba(255,255,255,.4);font-size:9px;font-weight:700;text-transform:uppercase;white-space:nowrap;margin-right:4px;}
.ins-t{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:rgba(255,255,255,.06);flex-shrink:0;min-width:60px;}
.ins-t:hover{background:rgba(255,255,255,.12);}
.ins-t.on{border-color:#fff;background:rgba(255,255,255,.18);}
.ins-sw{width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,255,255,.25);}
.ins-t.on .ins-sw{border-color:#fff;}
.ins-tn{font-size:8px;font-weight:700;color:#fff;white-space:nowrap;margin-top:1px;}
.ins-sp{width:1px;height:28px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 4px;}
.ins-ab{padding:5px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:9px;font-weight:700;cursor:pointer;flex-shrink:0;}
.ins-szr{background:var(--g1);padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--g2);}
.ins-szl{font-size:9px;color:var(--g5);font-weight:700;text-transform:uppercase;white-space:nowrap;}
.ins-szb{padding:4px 12px;border-radius:14px;border:1px solid var(--g3);background:var(--g0);color:var(--g5);font-size:9px;font-weight:700;cursor:pointer;}
.ins-szb.on{border-color:var(--se);background:var(--se);color:#052010;}
.ins-leg{display:flex;gap:8px;align-items:center;margin-left:6px;}
.ins-li{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--g5);}
.ins-ld{width:8px;height:8px;border-radius:50%;}
.ins-sc{overflow-y:auto;max-height:50vh;background:#0a1020;}
.ins-vp{position:relative;width:100%;}
.ins-vl{background:#071020;padding:4px 10px;font-size:8px;font-weight:700;color:var(--se);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g2);}
.ins-vc{font-size:8px;color:var(--g4);cursor:pointer;padding:2px 6px;border-radius:3px;}
.ins-vc:hover{color:var(--re);}
.ins-vw{position:relative;width:100%;line-height:0;}
.ins-vw img{width:100%;display:block;pointer-events:none;}
.ins-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;background:var(--bg);}
.ins-grid{position:absolute;top:0;left:0;width:100%;height:100%;display:grid;gap:0;}
.ins-cell{border:.5px solid rgba(80,120,180,.15);cursor:pointer;position:relative;}
.ins-cell:hover{border-color:rgba(255,255,255,.5);}
.ins-cell.sc{background:rgba(74,158,255,.55);border-color:#4a9eff;}
.ins-cell.de{background:rgba(240,80,80,.55);border-color:#f05050;}
.ins-cell.pr{background:rgba(245,166,35,.55);border-color:#f5a623;}
.ins-cell.sc::after,.ins-cell.de::after,.ins-cell.pr::after{content:'';position:absolute;inset:2px;border-radius:2px;}
.ins-cell.sc::after{border:1.5px solid rgba(74,158,255,.9);}
.ins-cell.de::after{border:1.5px solid rgba(240,80,80,.9);}
.ins-cell.pr::after{border:1.5px solid rgba(245,166,35,.9);}
.ins-bar{background:#071020;padding:6px 10px;border-top:1px solid var(--g2);}
.ins-bh{font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;margin-bottom:3px;display:flex;justify-content:space-between;}
.ins-tags{display:flex;flex-wrap:wrap;gap:3px;min-height:16px;}
.ins-tag{padding:2px 8px;border-radius:9px;font-size:8px;font-weight:700;}
.ins-tag.sc{background:var(--bs);color:var(--be);border:1px solid var(--bl);}
.ins-tag.de{background:var(--rg);color:var(--rl);border:1px solid var(--re);}
.ins-tag.pr{background:#301500;color:#ffd080;border:1px solid #f5a623;}
.ins-emsg{font-size:9px;color:var(--g4);font-style:italic;}

/* REPORTS */
.rpt-card{background:var(--g1);border:2px solid var(--g2);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer;}
.rpt-card:hover{border-color:var(--g3);}
.rpt-fn{font-size:16px;font-weight:800;color:var(--tx);}
.rpt-cl{font-size:12px;color:var(--g6);margin-top:2px;}
.rpt-meta{font-size:10px;color:var(--g5);margin-top:3px;}
.search-bar{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--tx);font-family:var(--font);width:100%;margin-bottom:12px;}
.search-bar:focus{outline:none;border-color:var(--se);}
.tab-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.tab-btn{padding:8px 16px;border-radius:20px;border:2px solid var(--g3);background:transparent;color:var(--g5);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.tab-btn.on{border-color:var(--se);background:var(--sg);color:var(--se);}
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--g2);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{position:absolute;left:-20px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--g3);background:var(--bg);}
.tl-dot.ok{border-color:var(--se);background:var(--sg);}
.tl-dot.info{border-color:var(--bl);background:var(--bs);}
.tl-date{font-size:10px;color:var(--g5);font-weight:700;margin-bottom:3px;}
.tl-title{font-size:13px;font-weight:700;color:var(--tx);}
.tl-body{font-size:11px;color:var(--g5);margin-top:2px;line-height:1.5;}

/* MISC */
.bdg{font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.bdg.g{background:var(--sg);color:var(--se);border:1px solid var(--gb);}
.bdg.r{background:var(--rg);color:var(--rl);border:1px solid var(--re);}
.bdg.a{background:var(--ag);color:var(--al);border:1px solid var(--am);}
.bdg.b{background:var(--bs);color:var(--be);border:1px solid var(--bl);}
.bdg.x{background:var(--g2);color:var(--g5);border:1px solid var(--g3);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g1);border:1px solid var(--g3);border-radius:24px;padding:10px 20px;font-size:13px;font-weight:700;color:var(--tx);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.ok{border-color:var(--gb);color:var(--se);}
.toast.err{border-color:var(--re);color:var(--rl);}
#upload-banner{display:none;position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#071a0f;border:1px solid var(--se);border-radius:20px;padding:8px 18px;font-size:12px;font-weight:700;color:var(--se);z-index:998;white-space:nowrap;}
</style>
</head>

// ── AUTH ─────────────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  const btn=document.querySelector('#login-screen .btn');btn.textContent='Signing in…';btn.disabled=true;
  const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
  btn.textContent='Sign In';btn.disabled=false;
  if(error){err.textContent=error.message;err.style.display='block';return;}
  currentUser=data.user;
  await loadProfile();
  showApp();
}
async function doLogout(){
  await SB.auth.signOut();
  currentUser=null;currentProfile=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
async function loadProfile(){
  if(!currentUser)return;
  const {data}=await SB.from('staff_profiles').select('*').eq('id',currentUser.id).single();
  if(data){currentProfile=data;document.getElementById('nav-user').textContent=`${data.name} · ${data.role}`;}
  else{currentProfile={name:currentUser.email.split('@')[0],role:'staff'};document.getElementById('nav-user').textContent=currentProfile.name;}
}
async function showApp(){
  document.getElementById('login-screen').style.display='none';
  const app=document.getElementById('app');app.style.display='flex';
  await loadFleetFromDB();
  await loadClients();
  renderOV();
}
async function restoreSession(){
  // Auth bypassed — go straight to app
  currentProfile={name:'Staff',role:'staff'};
  document.getElementById('nav-user').textContent='';
  await showApp();
}
async function loadFleetFromDB(){
  const {data}=await SB.from('vehicles').select('*');
  if(!data)return;
  data.forEach(row=>{
    const v=FLEET.find(f=>f.fn===row.fleet_no);
    if(v){v.odo=row.odo||v.odo;v.st=row.status||v.st;v.blocked=row.blocked_reason||null;
      if(row.lic_expiry)v.lic={expiry:row.lic_expiry};
      if(row.svc_last_km)v.svc={...v.svc,lastKm:row.svc_last_km,intKm:row.svc_interval_km||10000};}
  });
}
async function loadClients(){
  const {data}=await SB.from('client_profiles').select('*').order('full_name');
  clientList=data||[];
}

// ── OVERVIEW ─────────────────────────────────────────────────────
function renderOV(){
  const today = '2026-07-15';
  const todayD = new Date(today);
  const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}).toUpperCase();
  const daysFrom = d => Math.round((new Date(d+'T00:00:00') - todayD) / 86400000);

  // All arrivals and departures in next 7 days
  const arrivals = FLEET
    .filter(v=>v.rt && daysFrom(v.rt)>=0 && daysFrom(v.rt)<=7)
    .map(v=>({type:'in', fn:v.fn, cl:v.cl, date:v.rt, camping:v.camping, pax:v.pax, special:v.special||[], xb:v.xb, quote:v.quote, v}))
    .sort((a,b)=>a.date>b.date?1:-1);

  const departures = FLEET
    .filter(v=>v.pu && daysFrom(v.pu)>=0 && daysFrom(v.pu)<=7)
    .map(v=>({type:'out', fn:v.fn, cl:v.cl, date:v.pu, camping:v.camping, pax:v.pax, special:v.special||[], xb:v.xb, quote:v.quote, v}))
    .sort((a,b)=>a.date>b.date?1:-1);

  function movCard(m){
    const isToday = daysFrom(m.date)===0;
    const isOut   = m.type==='out';
    let inprog = null;
    try{ const raw=localStorage.getItem('inprogress_'+m.fn); if(raw) inprog=JSON.parse(raw); }catch(e){}
    const isInProgress = inprog && ((isOut && inprog.type==='checkout') || (!isOut && inprog.type==='checkin'));
    const startedTime = inprog ? new Date(inprog.started).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';

    const borderStyle = isInProgress ? '2px solid #e53e3e' : isToday ? '2px solid '+(isOut?'#4a6fa5':'#2a9d5c') : '1px solid #e8e8e8';
    const bgStyle = isInProgress ? '#fff5f5' : isToday ? (isOut?'#f0f4ff':'#f0faf4') : '#fff';
    const animStyle = isInProgress ? 'animation:dashPulse 1.2s infinite;' : '';

    const dateLabel = isToday ? '<span style="font-weight:800;color:'+(isOut?'#4a6fa5':'#2a9d5c')+'">TODAY</span>' : fmtDate(m.date);

    return `<div style="border:${borderStyle};border-radius:10px;padding:11px 13px;margin-bottom:8px;background:${bgStyle};cursor:pointer;${animStyle}"
      onclick="${isOut ? `startCO('${m.fn}')` : `startCI('${m.fn}')`}">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div style="width:38px;height:38px;border-radius:8px;background:${isInProgress?'#e53e3e':isOut?'#4a6fa5':'#2a9d5c'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${isInProgress
            ? `<span style="color:#fff;font-size:11px;font-weight:800;line-height:1;">${(inprog.staff||'?').slice(0,2).toUpperCase()}</span>`
            : `<span style="font-size:16px;">${isOut?'🔑':'🏠'}</span>`}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:14px;font-weight:800;color:#111;">${m.fn}</span>
            <span style="font-size:11px;font-weight:600;color:#555;">${m.v.reg}</span>
            <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${isOut?'#e8f0ff':'#e8f5ee'};color:${isOut?'#4a6fa5':'#2a9d5c'};">${isOut?'▶ DEPARTURE':'◀ ARRIVAL'}</span>
            ${m.quote?`<span style="font-size:10px;color:#888;">${m.quote}</span>`:''}
          </div>
          <div style="font-size:13px;font-weight:700;color:#111;margin-top:3px;">${m.cl}</div>
          <div style="font-size:11px;color:#666;margin-top:2px;">${dateLabel}
            ${m.camping?`<span style="margin-left:8px;color:#2a9d5c;font-weight:700;">🏕 ${m.pax} pax</span>`:`<span style="margin-left:8px;color:#888;">🏨 ${m.pax} pax</span>`}
            ${m.xb?`<span style="margin-left:8px;color:#e07b00;font-weight:700;">🌍 ${m.xb}</span>`:''}
          </div>
          ${(m.special||[]).length?`<div style="color:#e07b00;font-size:10px;font-weight:700;margin-top:3px;">⚠ ${m.special.join(' · ')}</div>`:''}
          ${isInProgress
            ? `<div style="font-size:11px;font-weight:800;color:#e53e3e;margin-top:4px;display:flex;align-items:center;gap:6px;">
                <span style="background:#e53e3e;color:#fff;border-radius:20px;padding:2px 10px;font-size:10px;">🔴 ${inprog.staff||'Staff'} — IN PROGRESS</span>
                <span style="font-size:9px;color:#e53e3e;">started ${startedTime}</span>
              </div>`
            : `<div style="font-size:10px;color:${isOut?'#4a6fa5':'#2a9d5c'};margin-top:3px;font-weight:700;">${isOut?'→ Tap to check out':'→ Tap to check in'}</div>`}
        </div>
      </div>
    </div>`;
  }

  function colHeader(label, count, color){
    return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:13px;font-weight:800;color:#111;text-transform:uppercase;letter-spacing:.5px;">${label}</div>
      <span style="background:${color};color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;">${count}</span>
    </div>`;
  }

  const body = document.getElementById('ov-body');
  if(!body) return;
  body.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px;">
      <!-- ARRIVALS -->
      <div>
        ${colHeader('◀ Arrivals', arrivals.length, '#2a9d5c')}
        ${arrivals.length
          ? arrivals.map(m=>movCard(m)).join('')
          : '<div style="text-align:center;color:#aaa;font-size:12px;padding:24px 0;">No arrivals in next 7 days</div>'}
      </div>
      <!-- DEPARTURES -->
      <div>
        ${colHeader('▶ Departures', departures.length, '#4a6fa5')}
        ${departures.length
          ? departures.map(m=>movCard(m)).join('')
          : '<div style="text-align:center;color:#aaa;font-size:12px;padding:24px 0;">No departures in next 7 days</div>'}
      </div>
    </div>`;
}>
