<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071a0f">
<title>Go Rent 4×4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f172a;--g0:#020812;--g1:#0f1a2e;--g2:#1a2740;--g3:#253550;--g4:#3a4f6a;--g5:#5a7090;--g6:#8aa0b8;--tx:#dde8f5;
  --gr:#0a2e1a;--gb:#145c30;--se:#3ddc84;--sg:#071a0f;
  --bl:#4a9eff;--bs:#0d2a50;--be:#93c5fd;
  --re:#f05050;--rg:#200a0a;--rl:#ffaaaa;
  --am:#f5a623;--ag:#201000;--al:#ffd080;
  --pu:#9d7af5;--ps:#160d35;
  --r:12px;--rs:8px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;-webkit-user-select:none;user-select:none;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(240,80,80,.4);}50%{opacity:.9;box-shadow:0 0 0 6px rgba(240,80,80,0);}}

/* NAV */
.nav{background:#071a0f;border-bottom:2px solid var(--gb);display:flex;align-items:center;padding:0 10px;height:56px;flex-shrink:0;gap:3px;overflow-x:auto;}
.logo{font-size:16px;font-weight:800;color:#fff;margin-right:10px;letter-spacing:-.5px;white-space:nowrap;}
.logo span{color:var(--se);}
.nb{padding:8px 10px;border-radius:8px;font-size:11px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:transparent;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.nb.on{background:rgba(61,220,132,.12);color:var(--se);border:1px solid rgba(61,220,132,.3);}

/* PAGES */
.page{display:none;flex-direction:column;height:calc(100vh - 56px);overflow:hidden;}
.page.on{display:flex;}
.scroll{flex:1;overflow-y:auto;padding:14px;}

/* OVERVIEW */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.ov-stat{background:var(--g1);border:1px solid var(--g2);border-radius:var(--r);padding:14px 10px;text-align:center;}
.ov-n{font-size:26px;font-weight:800;line-height:1;}
.ov-l{font-size:10px;color:var(--g5);margin-top:4px;text-transform:uppercase;letter-spacing:.4px;}
.vc{background:var(--g1);border:2px solid var(--g2);border-radius:var(--r);padding:12px;margin-bottom:7px;cursor:pointer;transition:all .15s;}
.vc:active{opacity:.8;transform:scale(.98);}
.vc.blk{border-color:var(--re);}
.vc.ret:hover{border-color:var(--bl);}
.vc:not(.blk):hover{border-color:var(--gb);}
.vc-fn{font-size:16px;font-weight:800;color:var(--tx);}
.vc-reg{font-size:11px;color:var(--g5);margin-left:6px;font-weight:400;}
.vc-cl{font-size:13px;color:var(--tx);margin-top:3px;}
.vc-meta{font-size:10px;color:var(--g5);margin-top:2px;}

/* FLOW */
.fhdr{background:var(--gr);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;border-left:4px solid var(--se);}
.fhdr-fn{font-size:20px;font-weight:800;color:#fff;}
.fhdr-fn span{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);margin-left:8px;}
.fhdr-cl{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;}

/* STEP TABS — 5 */
.stg-bar{display:grid;gap:3px;margin-bottom:14px;}
.stg-bar.s5{grid-template-columns:repeat(5,1fr);}
.stg-bar.s7{grid-template-columns:repeat(7,1fr);}
.stg-bar.s2{grid-template-columns:1fr 1fr;}
.stg-bar.s3{grid-template-columns:1fr 1fr 1fr;}
.stg{padding:9px 4px;text-align:center;font-size:9px;font-weight:700;color:var(--g5);cursor:pointer;background:var(--g1);border:2px solid var(--g2);border-radius:var(--rs);transition:all .15s;}
.stg.done{border-color:var(--gb);background:var(--sg);color:var(--se);}
.stg.active{border-color:var(--pu);background:var(--ps);color:#c4b5fd;}
.stg.locked{opacity:.3;cursor:not-allowed;}

/* STEP INTRO */
.step-intro{display:flex;align-items:center;gap:14px;background:var(--g2);border-radius:var(--r);padding:13px 16px;margin-bottom:12px;border-left:4px solid var(--se);}
.step-ico{font-size:38px;flex-shrink:0;}
.step-title{font-size:15px;font-weight:800;color:var(--tx);}
.step-sub{font-size:11px;color:var(--g5);margin-top:3px;line-height:1.5;}

/* CHECK ITEMS */
.chk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.ci{display:grid;grid-template-columns:46px 1fr 40px;align-items:center;gap:10px;padding:13px 14px;border-radius:var(--r);border:2px solid var(--g2);background:var(--g1);cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.ci:active{transform:scale(.98);}
.ci.ok{border-color:var(--se);background:var(--sg);}
.ci.prob{border-color:var(--re);background:var(--rg);}
.ci-icon{display:flex;align-items:center;justify-content:center;}
.ci-lbl{font-size:14px;font-weight:700;color:var(--g6);}
.ci.ok .ci-lbl{color:var(--se);}
.ci.prob .ci-lbl{color:var(--rl);}
.ci-det{font-size:10px;color:var(--g4);margin-top:2px;line-height:1.4;}
.ci.ok .ci-det{color:var(--gb);}

/* PROGRESS */
.prog-wrap{margin-bottom:12px;}
.prog-bar{height:10px;background:var(--g2);border-radius:5px;overflow:hidden;margin-bottom:6px;}
.prog-fill{height:100%;border-radius:5px;transition:width .3s;background:var(--se);}
.prog-lbl{font-size:12px;color:var(--g5);display:flex;align-items:center;gap:8px;}
.prog-n{font-size:16px;font-weight:800;color:var(--se);}

/* WHO */
.who-box{background:var(--g0);border:2px solid var(--am);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.who-lbl{font-size:12px;font-weight:700;color:var(--al);margin-bottom:8px;}
select{width:100%;padding:12px 14px;background:var(--g1);border:2px solid var(--g3);border-radius:var(--rs);color:var(--tx);font-size:15px;font-family:var(--font);color-scheme:dark;}
select:focus{outline:none;border-color:var(--se);}

/* FUEL */
.fuel-row{background:var(--g0);border:2px solid var(--am);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.fuel-lbl{font-size:12px;font-weight:700;color:var(--al);margin-bottom:8px;}
.fuel-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.fbtn{padding:10px 4px;border-radius:var(--rs);border:2px solid var(--g3);background:var(--g1);color:var(--g5);font-size:12px;font-weight:700;cursor:pointer;text-align:center;}
.fbtn.on{border-color:var(--se);background:var(--sg);color:var(--se);}

/* FORMS */
.fi{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fi label{font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.4px;}
input,textarea{width:100%;padding:12px 14px;background:var(--g0);border:2px solid var(--g3);border-radius:var(--rs);color:var(--tx);font-size:14px;font-family:var(--font);}
input:focus,textarea:focus{outline:none;border-color:var(--se);}
input::placeholder,textarea::placeholder{color:var(--g4);}
textarea{resize:vertical;min-height:60px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* LIABILITY / SIGN */
.liab{background:#180505;border:2px solid var(--re);border-radius:var(--r);padding:14px;margin-bottom:12px;font-size:12px;color:var(--rl);line-height:1.6;}
.liab strong{color:#fff;font-size:14px;}
.sig-area{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);overflow:hidden;margin:8px 0;}
.sig-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--g1);border-bottom:1px solid var(--g2);}
.sig-lbl{font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;}
.sig-clr{font-size:10px;color:var(--g4);cursor:pointer;padding:3px 8px;border-radius:4px;}
.sig-clr:hover{color:var(--re);}
.sig-cv{display:block;width:100%;height:90px;cursor:crosshair;touch-action:none;}
.signed{display:flex;align-items:center;gap:10px;background:var(--sg);border:2px solid var(--gb);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:18px;}
.signed-name{font-size:14px;font-weight:700;color:var(--se);}
.signed-time{font-size:10px;color:var(--gb);margin-left:auto;}

/* ALERTS */
.al{padding:12px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;border-left:4px solid;line-height:1.5;}
.al.ok{background:var(--sg);border-color:var(--se);color:var(--se);}
.al.warn{background:var(--rg);border-color:var(--re);color:var(--rl);}
.al.info{background:var(--ag);border-color:var(--am);color:var(--al);}
.al.blue{background:var(--bs);border-color:var(--bl);color:var(--be);}

/* BUTTONS */
.btn{padding:14px 18px;border-radius:var(--r);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:var(--font);transition:all .12s;width:100%;margin-top:8px;}
.btn.g{background:var(--se);color:#052010;}
.btn.g:hover{background:#5afa9a;}
.btn.s{background:transparent;border:2px solid var(--g3);color:var(--g6);}
.btn.r{background:#c0392b;color:#fff;}
.btn-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--g2);}
.btn-row .btn{margin-top:0;}

/* INFO */
.info-item{background:var(--g1);border:1px solid var(--g2);border-radius:var(--rs);padding:10px 12px;}
.info-lbl{font-size:9px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.4px;}
.info-val{font-size:14px;font-weight:700;color:var(--tx);margin-top:3px;}

/* RETURN EQUIPMENT */
.ret-grp{border:2px solid var(--g2);border-radius:var(--r);padding:13px;margin-bottom:8px;background:var(--g1);}
.ret-grp.ok{border-color:var(--se);background:var(--sg);}
.ret-grp.dmg{border-color:var(--am);background:var(--ag);}
.ret-grp.miss{border-color:var(--re);background:var(--rg);}
.ret-grp-name{font-size:14px;font-weight:800;margin-bottom:3px;}
.ret-grp.ok .ret-grp-name{color:var(--se);}
.ret-grp.dmg .ret-grp-name{color:var(--al);}
.ret-grp.miss .ret-grp-name{color:var(--rl);}
.ret-grp-items{font-size:10px;color:var(--g5);margin-bottom:10px;line-height:1.5;}
.ret-grp.ok .ret-grp-items{color:var(--gb);}
.ret-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.rbtn{padding:10px 4px;border-radius:var(--rs);border:2px solid var(--g3);background:var(--g0);color:var(--g5);font-size:11px;font-weight:800;cursor:pointer;text-align:center;}
.rbtn:active{transform:scale(.95);}
.rbtn.ok-on{border-color:var(--se);background:var(--sg);color:var(--se);}
.rbtn.dmg-on{border-color:var(--am);background:var(--ag);color:var(--al);}
.rbtn.miss-on{border-color:var(--re);background:var(--rg);color:var(--rl);}

/* PHOTOS */
.photo-sec{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);padding:13px;margin-bottom:12px;}
.photo-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.photo-sub{font-size:10px;color:var(--g5);margin-bottom:10px;line-height:1.4;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.p-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--g2);}
.p-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.p-del{position:absolute;top:4px;right:4px;background:rgba(240,80,80,.9);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.p-add{aspect-ratio:1;border-radius:8px;border:2px dashed var(--g4);background:var(--g1);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:5px;}
.p-add:hover{border-color:var(--se);background:var(--sg);}
.p-add-ico{font-size:24px;}
.p-add-lbl{font-size:9px;font-weight:700;color:var(--g5);text-transform:uppercase;}
.p-add:hover .p-add-lbl{color:var(--se);}
input[type=file]{display:none;}

/* DOC CAPTURE */
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.doc-slot{border:2px dashed var(--g3);border-radius:var(--r);aspect-ratio:1.6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--g0);position:relative;overflow:hidden;gap:6px;transition:all .15s;}
.doc-slot:hover{border-color:var(--se);}
.doc-slot.captured{border-color:var(--se);border-style:solid;}
.doc-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.doc-slot-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.doc-slot-ico{font-size:26px;}
.doc-slot-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.4px;text-align:center;padding:0 8px;}
.doc-slot-sub{font-size:9px;color:rgba(255,255,255,.5);text-align:center;padding:0 8px;}
.doc-slot.captured .doc-slot-lbl{color:var(--se);}

/* SUMMARY */
.sum-box{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);padding:13px;margin-bottom:12px;}
.sum-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;}
.sum-row{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--g2);font-size:12px;}
.sum-row:last-child{border-bottom:none;}
.sum-lbl{font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.3px;padding-top:1px;}
.sum-val{color:var(--g6);}
.sum-val.ok{color:var(--se);}
.sum-val.warn{color:var(--rl);font-weight:700;}

/* ACCOUNTABILITY */
.done{text-align:center;padding:30px 20px;}
.done-ico{font-size:56px;margin-bottom:12px;}
.done-title{font-size:20px;font-weight:800;color:var(--se);margin-bottom:5px;}
.done-sub{font-size:13px;color:var(--g5);line-height:1.5;}
.acc{border:2px solid var(--g2);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
.acc-hdr{background:var(--g2);padding:10px 14px;font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;}
.acc-row{padding:11px 14px;border-bottom:1px solid var(--g2);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;}
.acc-row:last-child{border-bottom:none;}
.acc-row.good{background:rgba(61,220,132,.04);}
.acc-row.bad{background:rgba(240,80,80,.07);}
.acc-ico{font-size:20px;}
.acc-name{font-size:13px;font-weight:700;}
.acc-row.good .acc-name{color:var(--se);}
.acc-row.bad .acc-name{color:var(--rl);}
.acc-detail{font-size:10px;color:var(--g5);margin-top:2px;line-height:1.5;}
.acc-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.acc-badge.ok{background:var(--sg);color:var(--se);}
.acc-badge.warn{background:var(--rg);color:var(--rl);}

/* INSPECTOR */
.ins-wrap{background:var(--g0);border-radius:var(--r);overflow:hidden;border:1px solid var(--g2);margin-bottom:12px;}
.ins-tb{background:#071a0f;padding:8px 10px;display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--gb);overflow-x:auto;}
.ins-tl{color:rgba(255,255,255,.4);font-size:9px;font-weight:700;text-transform:uppercase;white-space:nowrap;margin-right:4px;}
.ins-t{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:rgba(255,255,255,.06);flex-shrink:0;min-width:60px;}
.ins-t:hover{background:rgba(255,255,255,.12);}
.ins-t.on{border-color:#fff;background:rgba(255,255,255,.18);}
.ins-sw{width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,255,255,.25);}
.ins-t.on .ins-sw{border-color:#fff;}
.ins-tn{font-size:8px;font-weight:700;color:#fff;white-space:nowrap;margin-top:1px;}
.ins-sp{width:1px;height:28px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 4px;}
.ins-ab{padding:5px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:9px;font-weight:700;cursor:pointer;flex-shrink:0;}
.ins-szr{background:var(--g1);padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--g2);}
.ins-szl{font-size:9px;color:var(--g5);font-weight:700;text-transform:uppercase;white-space:nowrap;}
.ins-szb{padding:4px 12px;border-radius:14px;border:1px solid var(--g3);background:var(--g0);color:var(--g5);font-size:9px;font-weight:700;cursor:pointer;}
.ins-szb.on{border-color:var(--se);background:var(--se);color:#052010;}
.ins-leg{display:flex;gap:8px;align-items:center;margin-left:6px;}
.ins-li{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--g5);}
.ins-ld{width:8px;height:8px;border-radius:50%;}
.ins-sc{overflow-y:auto;max-height:50vh;background:#0a1020;}
.ins-vp{position:relative;width:100%;}
.ins-vl{background:#071020;padding:4px 10px;font-size:8px;font-weight:700;color:var(--se);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g2);}
.ins-vc{font-size:8px;color:var(--g4);cursor:pointer;padding:2px 6px;border-radius:3px;}
.ins-vc:hover{color:var(--re);}
.ins-vw{position:relative;width:100%;line-height:0;}
.ins-vw img{width:100%;display:block;pointer-events:none;}
.ins-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;background:var(--bg);}
.ins-grid{position:absolute;top:0;left:0;width:100%;height:100%;display:grid;gap:0;}
.ins-cell{border:.5px solid rgba(80,120,180,.15);cursor:pointer;position:relative;}
.ins-cell:hover{border-color:rgba(255,255,255,.5);}
.ins-cell.sc{background:rgba(74,158,255,.55);border-color:#4a9eff;}
.ins-cell.de{background:rgba(240,80,80,.55);border-color:#f05050;}
.ins-cell.pr{background:rgba(245,166,35,.55);border-color:#f5a623;}
.ins-cell.sc::after,.ins-cell.de::after,.ins-cell.pr::after{content:'';position:absolute;inset:2px;border-radius:2px;}
.ins-cell.sc::after{border:1.5px solid rgba(74,158,255,.9);}
.ins-cell.de::after{border:1.5px solid rgba(240,80,80,.9);}
.ins-cell.pr::after{border:1.5px solid rgba(245,166,35,.9);}
.ins-bar{background:#071020;padding:6px 10px;border-top:1px solid var(--g2);}
.ins-bh{font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;margin-bottom:3px;display:flex;justify-content:space-between;}
.ins-tags{display:flex;flex-wrap:wrap;gap:3px;min-height:16px;}
.ins-tag{padding:2px 8px;border-radius:9px;font-size:8px;font-weight:700;}
.ins-tag.sc{background:var(--bs);color:var(--be);border:1px solid var(--bl);}
.ins-tag.de{background:var(--rg);color:var(--rl);border:1px solid var(--re);}
.ins-tag.pr{background:#301500;color:#ffd080;border:1px solid #f5a623;}
.ins-emsg{font-size:9px;color:var(--g4);font-style:italic;}

/* REPORTS */
.rpt-card{background:var(--g1);border:2px solid var(--g2);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer;}
.rpt-card:hover{border-color:var(--g3);}
.rpt-fn{font-size:16px;font-weight:800;color:var(--tx);}
.rpt-cl{font-size:12px;color:var(--g6);margin-top:2px;}
.rpt-meta{font-size:10px;color:var(--g5);margin-top:3px;}
.search-bar{background:var(--g0);border:2px solid var(--g3);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--tx);font-family:var(--font);width:100%;margin-bottom:12px;}
.search-bar:focus{outline:none;border-color:var(--se);}
.tab-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.tab-btn{padding:8px 16px;border-radius:20px;border:2px solid var(--g3);background:transparent;color:var(--g5);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.tab-btn.on{border-color:var(--se);background:var(--sg);color:var(--se);}
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--g2);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{position:absolute;left:-20px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--g3);background:var(--bg);}
.tl-dot.ok{border-color:var(--se);background:var(--sg);}
.tl-dot.info{border-color:var(--bl);background:var(--bs);}
.tl-date{font-size:10px;color:var(--g5);font-weight:700;margin-bottom:3px;}
.tl-title{font-size:13px;font-weight:700;color:var(--tx);}
.tl-body{font-size:11px;color:var(--g5);margin-top:2px;line-height:1.5;}

/* MISC */
.bdg{font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.bdg.g{background:var(--sg);color:var(--se);border:1px solid var(--gb);}
.bdg.r{background:var(--rg);color:var(--rl);border:1px solid var(--re);}
.bdg.a{background:var(--ag);color:var(--al);border:1px solid var(--am);}
.bdg.b{background:var(--bs);color:var(--be);border:1px solid var(--bl);}
.bdg.x{background:var(--g2);color:var(--g5);border:1px solid var(--g3);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g1);border:1px solid var(--g3);border-radius:24px;padding:10px 20px;font-size:13px;font-weight:700;color:var(--tx);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.ok{border-color:var(--gb);color:var(--se);}
.toast.err{border-color:var(--re);color:var(--rl);}
#upload-banner{display:none;position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#071a0f;border:1px solid var(--se);border-radius:20px;padding:8px 18px;font-size:12px;font-weight:700;color:var(--se);z-index:998;white-space:nowrap;}
</style>
</head>

// ── AUTH ─────────────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return;}
  const btn=document.querySelector('#login-screen .btn');btn.textContent='Signing in…';btn.disabled=true;
  const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
  btn.textContent='Sign In';btn.disabled=false;
  if(error){err.textContent=error.message;err.style.display='block';return;}
  currentUser=data.user;
  await loadProfile();
  showApp();
}
async function doLogout(){
  await SB.auth.signOut();
  currentUser=null;currentProfile=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
async function loadProfile(){
  if(!currentUser)return;
  const {data}=await SB.from('staff_profiles').select('*').eq('id',currentUser.id).single();
  if(data){currentProfile=data;document.getElementById('nav-user').textContent=`${data.name} · ${data.role}`;}
  else{currentProfile={name:currentUser.email.split('@')[0],role:'staff'};document.getElementById('nav-user').textContent=currentProfile.name;}
}
async function showApp(){
  document.getElementById('login-screen').style.display='none';
  const app=document.getElementById('app');app.style.display='flex';
  await loadFleetFromDB();
  await loadClients();
  renderOV();
}
async function restoreSession(){
  // Auth bypassed — go straight to app
  currentProfile={name:'Staff',role:'staff'};
  document.getElementById('nav-user').textContent='';
  await showApp();
}
async function loadFleetFromDB(){
  const {data}=await SB.from('vehicles').select('*');
  if(!data)return;
  data.forEach(row=>{
    const v=FLEET.find(f=>f.fn===row.fleet_no);
    if(v){v.odo=row.odo||v.odo;v.st=row.status||v.st;v.blocked=row.blocked_reason||null;
      if(row.lic_expiry)v.lic={expiry:row.lic_expiry};
      if(row.svc_last_km)v.svc={...v.svc,lastKm:row.svc_last_km,intKm:row.svc_interval_km||10000};}
  });
}

          +(arrivals.length ? arrivals.map(m=>movCard(m)).join('') : '<div style="text-align:center;color:var(--g5);font-size:12px;padding:24px 0;">No arrivals in next 7 days</div>')
        +'</div>'

          +(departures.length ? departures.map(m=>movCard(m)).join('') : '<div style="text-align:center;color:var(--g5);font-size:12px;padding:24px 0;">No departures in next 7 days</div>')

async function loadOvHistory(){
  const el = document.getElementById('ov-history-body');
  if(!el) return;

  const today = new Date('2026-07-15');
  const from7 = new Date(today); from7.setDate(from7.getDate()-7);
  const from7iso = from7.toISOString();

  const [{data:cos},{data:cis}] = await Promise.all([
    SB.from('checkouts').select('*').gte('created_at', from7iso).order('created_at',{ascending:false}),
    SB.from('checkins').select('*').gte('created_at', from7iso).order('created_at',{ascending:false}),
  ]);

  const all = [
    ...(cos||[]).map(c=>({...c,_type:'out',_date:c.created_at})),
    ...(cis||[]).map(c=>({...c,_type:'in',_date:c.created_at})),
  ].sort((a,b)=>new Date(b._date)-new Date(a._date));

  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : '—';
  const fmtTime = d => d ? new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
  const fmtDT = d => d ? fmtDate(d)+' · '+fmtTime(d) : '—';

  if(!all.length){
    el.innerHTML = '<div class="al info" style="text-align:center;">No check-outs or check-ins recorded in the past 7 days</div>';
    return;
  }

  // Summary counts
  const totalOut=(cos||[]).length, totalIn=(cis||[]).length;
  const withDamage=all.filter(r=>r.new_damage).length;
  const fuelShort=all.filter(r=>r.fuel_short).length;

  function histCard(c){
    const isOut=c._type==='out';
    const hasIssues=c.new_damage||c.fuel_short||(c.missing_items?.length>0)||(c.unchecked_prep?.length>0);
    const accent=isOut?'#4a6fa5':'#2a9d5c';
    const border=hasIssues?'#e53e3e':isOut?'rgba(74,111,165,.4)':'rgba(42,157,92,.4)';

    const staffRows=isOut?[
      {role:'🧹 Prep & Pack',name:c.prep_by,signed:c.prep_signed_at},
      {role:'🔍 Handover',name:c.handover_by,signed:null},
      {role:'👔 Manager',name:c.manager_name,signed:c.manager_signed_at},
    ]:[
      {role:'📥 Received by',name:c.received_by,signed:c.customer_signed_at},
      {role:'👔 Manager',name:c.manager_name,signed:c.manager_signed_at},
    ];

    return '<div style="border:1px solid '+border+';border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--g1);">'
      // Header
      +'<div style="background:'+(isOut?'rgba(74,111,165,.1)':'rgba(42,157,92,.1)')+';padding:10px 14px;border-bottom:1px solid '+border+';display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">'
        +'<div style="display:flex;align-items:center;gap:10px;">'
          +'<div style="width:36px;height:36px;border-radius:8px;background:'+accent+';display:flex;align-items:center;justify-content:center;font-size:18px;">'+(isOut?'🔑':'🏠')+'</div>'
          +'<div>'
            +'<div style="font-size:14px;font-weight:800;color:var(--tx);">'+(c.fleet_no||'—')+' <span style="font-size:11px;font-weight:400;color:var(--g5);">'+(c.client||'—')+'</span></div>'
            +'<div style="font-size:10px;font-weight:700;color:'+accent+';text-transform:uppercase;letter-spacing:.5px;">'+(isOut?'▶ Check-Out':'◀ Check-In')+'</div>'
          +'</div>'
        +'</div>'
        +'<div style="text-align:right;flex-shrink:0;">'
          +'<div style="font-size:12px;font-weight:700;color:var(--tx);">📅 '+fmtDate(c._date)+'</div>'
          +'<div style="font-size:11px;color:var(--g5);">🕐 '+fmtTime(c._date)+'</div>'
        +'</div>'
      +'</div>'
      // Staff accountability — full width grid
      +'<div style="padding:10px 14px;border-bottom:1px solid var(--g2);">'
        +'<div style="font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;">👤 Responsible Staff</div>'
        +'<div style="display:grid;grid-template-columns:'+(isOut?'1fr 1fr 1fr':'1fr 1fr')+';gap:6px;">'
          +staffRows.map(s=>{
            const ok=s.name&&s.name!=='—';
            return '<div style="background:var(--g0);border-radius:7px;padding:8px 10px;border-left:3px solid '+(ok?accent:'var(--re)')+';">'
              +'<div style="font-size:9px;font-weight:700;color:var(--g5);text-transform:uppercase;margin-bottom:3px;">'+s.role+'</div>'
              +'<div style="font-size:13px;font-weight:800;color:'+(ok?'var(--tx)':'var(--rl)')+';">'+(s.name||'⚠ Not recorded')+'</div>'
              +(s.signed?'<div style="font-size:9px;color:var(--se);margin-top:2px;">✅ signed '+fmtTime(s.signed)+'</div>':'')
            +'</div>';
          }).join('')
        +'</div>'
      +'</div>'
      // Data row
      +'<div style="padding:10px 14px;'+(hasIssues?'border-bottom:1px solid var(--g2);':'')+'">'
        +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">'
          +(isOut?[
            ['🛣 ODO out',(c.odo_out?Number(c.odo_out).toLocaleString()+' km':'—')],
            ['⛽ Fuel out',c.fuel_out||'—'],
            ['✅ Prep',(c.unchecked_prep?.length?'⚠ '+c.unchecked_prep.length+' skipped':'All done')],
            ['🔍 Damage',(c.damage_panels?.length?'⚠ '+c.damage_panels.length+' panels':'None')],
          ]:[
            ['🛣 KM driven',(c.km_driven?Number(c.km_driven).toLocaleString()+' km':'—')],
            ['⛽ Fuel in',c.fuel_in||'—'],
            ['💰 Deposit',c.deposit_decision||'—'],
            ['🔍 New dmg',(c.new_damage_panels?.length?'⚠ '+c.new_damage_panels.length+' panels':'None')],
          ]).map(([l,v])=>'<div style="background:var(--g0);border-radius:6px;padding:7px 5px;text-align:center;">'
            +'<div style="font-size:9px;color:var(--g5);text-transform:uppercase;margin-bottom:2px;">'+l+'</div>'
            +'<div style="font-size:11px;font-weight:700;color:var(--tx);">'+v+'</div>'
          +'</div>').join('')
        +'</div>'
      +'</div>'
      // Issue badges
      +(hasIssues?'<div style="padding:7px 14px;background:rgba(240,80,80,.06);display:flex;flex-wrap:wrap;gap:5px;">'
        +(c.new_damage?'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--rg);color:var(--rl);">🔴 New damage</span>':'')
        +(c.fuel_short?'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--ag);color:var(--al);">⛽ Fuel short</span>':'')
        +((c.missing_items?.length)?'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--rg);color:var(--rl);">❌ '+c.missing_items.length+' missing</span>':'')
        +((c.unchecked_prep?.length)?'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--ag);color:var(--al);">⚠ '+c.unchecked_prep.length+' unchecked at prep</span>':'')
      +'</div>':'')
    +'</div>';
  }

  el.innerHTML =
    // Summary stats bar
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;">'
      +[
        ['📤','Check-outs',totalOut,'#4a6fa5'],
        ['📥','Check-ins',totalIn,'#2a9d5c'],
        ['🔴','Issues',withDamage+fuelShort,'#e53e3e'],
        ['📅','Days covered','7','var(--g5)'],
      ].map(([ico,lbl,n,col])=>'<div style="background:var(--g1);border:1px solid var(--g2);border-radius:8px;padding:10px;text-align:center;">'
        +'<div style="font-size:16px;">'+ico+'</div>'
        +'<div style="font-size:22px;font-weight:800;color:'+col+';line-height:1.1;">'+n+'</div>'
        +'<div style="font-size:9px;color:var(--g5);text-transform:uppercase;margin-top:2px;">'+lbl+'</div>'
      +'</div>').join('')
    +'</div>'
    // All records
    +all.map(histCard).join('');
}

function startCO(fn){
  const v=FLEET.find(x=>x.fn===fn);if(!v||v.st==='rented'){toast('Not available','err');return;}
  // Mark as in-progress (preserve existing staff if already set)
  try{
    const existing=localStorage.getItem('inprogress_'+fn);
    const prev=existing?JSON.parse(existing):{};
    localStorage.setItem('inprogress_'+fn, JSON.stringify({
      type:'checkout',fn,cl:v.cl,
      started:prev.started||new Date().toISOString(),
      staff:prev.staff||'',
      staffLocked:prev.staffLocked||false
    }));
    // Restore staff name
    if(prev.staff){co.prepBy=prev.staff;}
  }catch(e){}
  co={v,fn,
    prepBy:'',prepSig:null,prepAt:'',prepItems:{},prepPhotos:[],fuelOut:'Full',
    prepLog:[],prepCheckedBy:{},
    equipSig:null,equipAt:'',equipLog:[],
    clientName:v.cl||'',clientEmail:'',clientPassport:null,clientID:null,
    licFront:null,licBack:null,
    contract:null,contractSigned:false,
    dmgDone:false,
    mechBy:'',mechItems:{},
    dmgd:[],dmgPhotos:[],
    custSig:null,custAt:'',
    mgmtBy:'',mgmtSig:null,mgmtAt:'',
  };
  initIM();coStep=0;goPage('co');drawCO();
}

const CO_STEPS=[
  {n:0,ico:'🚗',lbl:'Vehicle',    sub:'Checks & fuel'},
  {n:1,ico:'🏕',lbl:'Equipment',  sub:'Camping gear'},
  {n:2,ico:'📷',lbl:'Client ID',  sub:'Passport & licence'},
  {n:3,ico:'📋',lbl:'Contract',   sub:'Sign agreement'},
  {n:4,ico:'🔍',lbl:'Damage',     sub:'Inspect body'},
  {n:5,ico:'✍️',lbl:'Handover',   sub:'Client accepts'},
  {n:6,ico:'👔',lbl:'Management', sub:'Clear to go'},
];

function drawCO(){
  // Step progress bar
  const bar=CO_STEPS.map(s=>{
    const done=(s.n===0&&!!co.prepSig)||(s.n===1&&!!co.equipSig)||
               (s.n===2&&!!(co.clientPassport||co.licFront))||
               (s.n===3&&co.contractSigned)||(s.n===4&&!!co.dmgDone)||
               (s.n===5&&!!co.custSig)||(s.n===6&&!!co.mgmtSig);
    const active=s.n===coStep;
    return `<div class="stg ${active?'active':done?'done':''}" onclick="coGoStep(${s.n})">
      <div style="font-size:16px">${done&&!active?'✅':s.ico}</div>
      <div style="font-size:9px;margin-top:2px">${s.lbl}</div>
    </div>`;
  }).join('');

  const body=coStep===0?coStep0():coStep===1?coStep1_equip():coStep===2?coStep1():coStep===3?coStep2():coStep===4?coStep4_dmg():coStep===5?coStep5_client():coStep6_mgmt();

  document.getElementById('co-body').innerHTML=`
    <div class="fhdr">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="fhdr-fn">${co.fn} <span>${co.v.reg}</span></div>
          <div class="fhdr-cl">${co.clientName||co.v.cl||'No booking'}</div>
          <div class="fhdr-cl" style="font-size:10px;opacity:.7;margin-top:1px">📅 ${co.v.pu||'?'} → ${co.v.rt||'?'}</div>
        </div>
        <div style="text-align:right">
          <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;${co.v.camping?'background:rgba(61,220,132,.15);color:var(--se);border:1px solid var(--gb)':'background:var(--g2);color:var(--g5);border:1px solid var(--g3)'}">
            ${co.v.camping?'🏕 Camping':'🏨 No camping'}
          </span><br>
          <span style="font-size:10px;color:var(--g5);margin-top:3px;display:inline-block">👥 ${co.v.pax||'?'} pax${co.v.xb?' · 🌍 '+co.v.xb:''}</span>
        </div>
      </div>
      ${(co.v.special||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:7px">
        ${(co.v.special||[]).map(t=>`<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--ag);color:var(--al);border:1px solid var(--am)">⚠ ${t}</span>`).join('')}
      </div>`:''}
    </div>
    <div class="stg-bar s7">${bar}</div>
    <div id="cos">${body}</div>
    <div class="btn-row">
      ${coStep>0?`<button class="btn s" style="flex:1" onclick="coGoStep(coStep-1)">← Back</button>`:''}
      ${coStep<6?`<button class="btn g" style="flex:2" onclick="coGoStep(coStep+1)">Next →</button>`:''}
    </div>`;
  setTimeout(()=>['co-p-sig','co-equip-sig','co-c-sig','co-m-sig'].forEach(initSig),80);
  if(coStep===3)setTimeout(()=>{VIEWS.forEach(v=>buildIG(v));renderIS();},100);
}

function coGoStep(t){
  coStep=Math.max(0,Math.min(6,t));drawCO();
}

// ── STEP 0: Prep & Pack ──────────────────────────────────────────
function coStep0(){
  // Vehicle section only — items BEFORE the camping equipment section
  const L_VEH=[];
  let inVeh=true;
  for(const item of L_PREP){
    if(item[0]==='__SECTION__'&&item[1].startsWith('🏕')) inVeh=false;
    if(inVeh) L_VEH.push(item);
  }
  const _pst=l=>{const v=co.prepItems[l];return v?.st||v||'';};
  const _pby=l=>{const v=co.prepItems[l];return v?.by||'';};
  const _pat=l=>{const v=co.prepItems[l];return v?.at||'';};
  const done=L_VEH.filter(([i,l])=>i!=='__SECTION__'&&i!=='__OPTIONAL__'&&_pst(l)&&_pst(l)!=='na').length;
  const checkable=L_VEH.filter(([i,l])=>i!=='__SECTION__'&&i!=='__OPTIONAL__').length;
  const pct=Math.round(done/checkable*100);
  const probs=L_VEH.filter(([i,l])=>i!=='__SECTION__'&&i!=='__OPTIONAL__'&&_pst(l)==='prob').map(([i,l])=>l);
  // Staff who have checked items in this section
  const staffOnStep=Object.keys(co.prepCheckedBy||{}).filter(n=>co.prepLog?.some(e=>e.by===n));
  return `
  <div class="step-intro">
    <div class="step-ico">🚗</div>
    <div><div class="step-title">Step 1 — Vehicle Checks</div>
    <div class="step-sub">Tap each item: once = ✅ OK · twice = ⚠ Problem · Grey = NOT CHECKED = your liability</div></div>
  </div>
  <div class="who-box">
    <div class="who-lbl">👤 Who is preparing this vehicle?</div>
    ${selStaff('co-p-nm',STAFF_PREP,co.prepBy)}
  </div>
  ${licDiscBanner(co.v,'out')}
  <div class="fuel-row" style="flex-wrap:wrap;gap:10px;">
    <div style="flex:1;min-width:160px;">
      <div class="fuel-lbl">🛣 Odometer OUT (km)</div>
      <input type="number" id="co-odo-out" value="${co.odometerOut||co.v.odo||''}"
        placeholder="e.g. 42350" oninput="co.odometerOut=+this.value"
        style="padding:10px 14px;font-size:15px;font-weight:700;background:var(--g0);border:2px solid var(--gb);border-radius:var(--rs);color:var(--tx);width:100%;margin-top:6px;">
    </div>
  </div>
  <div class="fuel-row">
    <div class="fuel-lbl">⛽ Fuel level OUT</div>
    <div class="fuel-btns">${['Empty','1/4','1/2','3/4','Full'].map(f=>
      `<button class="fbtn${co.fuelOut===f?' on':''}" onclick="co.fuelOut='${f}';this.closest('.fuel-btns').querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${f}</button>`).join('')}</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-lbl"><span class="prog-n">${done}/${checkable}</span> items checked
    ${pct===100?'<span style="color:var(--se);font-weight:700;margin-left:8px">✅ All done!</span>':''}</div>
  </div>
  <div class="chk-list">${L_VEH.map(([ico,lbl,det],i)=>{
    if(ico==='__SECTION__'||ico==='__OPTIONAL__'){
      const isOpt=ico==='__OPTIONAL__';
      const isMain=!isOpt&&(lbl.startsWith('🚗 Vehicle')||lbl.startsWith('📦')||lbl.startsWith('📦 Loose'));
      return `<div style="background:${isOpt?'var(--ag)':isMain?'var(--g2)':'var(--g1)'};border-radius:var(--rs);padding:${isMain?'9px 14px':'7px 14px 7px 20px'};margin:${isMain?'10px 0 6px':'4px 0 3px'};border-left:${isOpt?'3px solid var(--am)':isMain?'none':'3px solid var(--se)'};display:flex;align-items:center;gap:10px;">
        <span style="font-size:${isMain?'18':'15'}px;">${lbl.split(' ')[0]}</span>
        <div><div style="font-size:${isMain?'12':'11'}px;font-weight:800;color:${isOpt?'var(--al)':isMain?'var(--tx)':'var(--se)'};">${lbl.replace(lbl.split(' ')[0]+' ','')}</div>
        <div style="font-size:10px;color:var(--g5);">${det}</div></div>
      </div>`;
    }
    const st=_pst(lbl);const by=_pby(lbl);const at=_pat(lbl);
    const isQtyItem=lbl.startsWith('__QTY__');
    const realLbl=isQtyItem?lbl.replace('__QTY__',''):lbl;
    const naSVG=()=>`<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="rgba(90,112,144,.15)" stroke="#5a7090" stroke-width="2"/><path d="M8 12h8" stroke="#5a7090" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    return `<div class="ci ${st==='ok'?'ok':st==='prob'?'prob':''}" onclick="tapPrep(${i})">
      <div class="ci-icon">${ico==='__OPT_ITEM__'?`<svg width="36" height="36" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#5a7090" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M8 12h8M12 8v8" stroke="#5a7090" stroke-width="1.5" stroke-linecap="round"/></svg>`:ico}</div>
      <div class="ci-text">
        <div class="ci-lbl">${realLbl}</div>
        <div class="ci-det">${det}${by?` <span style="font-size:9px;color:var(--se);font-weight:700;margin-left:6px;">✓ ${by}${at?' · '+at:''}</span>`:''}</div>
      </div>
      <div class="ci-st">${st==='ok'?okSVG():st==='prob'?probSVG():st==='na'?naSVG():uncSVG()}</div>

  }).join('')}</div>
  ${probs.length?`<div class="al warn">⚠ Problems noted: ${probs.join(' · ')}</div>`:''}
  ${staffOnStep.length>1?`<div style="background:var(--g1);border:2px solid var(--am);border-radius:var(--rs);padding:10px 14px;margin-bottom:10px;">
    <div style="font-size:10px;font-weight:700;color:var(--al);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;">👥 Multiple staff on this step</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${staffOnStep.map(n=>{const cnt=co.prepLog?.filter(e=>e.by===n).length||0;return '<div style="background:var(--g0);border:1px solid var(--am);border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--am);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000;">'+n.slice(0,2).toUpperCase()+'</div><div><div style="font-size:12px;font-weight:700;color:var(--al);">'+n+'</div><div style="font-size:10px;color:var(--g5);">'+cnt+' item'+(cnt!==1?'s':'')+' checked</div></div></div>';}).join('')}
    </div>
  </div>`:''}
  ${photoHTML('co.prepPhotos','📷 Vehicle Photos','Photograph the vehicle exterior — all sides. Proof of condition before departure.',4)}
  ${co.prepSig?

    <button class="btn g" onclick="signPrep()">✓ Sign & Confirm — Vehicle Check Complete</button>`}`;

function tapPrep(i){
  const nm=document.getElementById('co-p-nm')?.value;if(nm)co.prepBy=nm;
  if(!co.prepBy){toast('Select your name first','err');return;}
  if(L_PREP[i][0]==='__SECTION__'||L_PREP[i][0]==='__OPTIONAL__')return;
  if(L_PREP[i][1]?.startsWith('__QTY__'))return;
  const lbl=L_PREP[i][1];
  const isOpt=L_PREP[i][0]==='__OPT_ITEM__';
  const prevSt=(co.prepItems[lbl]?.st)||co.prepItems[lbl]||'';
  let newSt;
  if(isOpt) newSt=prevSt===''?'ok':prevSt==='ok'?'prob':prevSt==='prob'?'na':'';
  else newSt=prevSt===''?'ok':prevSt==='ok'?'prob':'';
  const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  co.prepItems[lbl]={st:newSt,by:co.prepBy,at:ts};
  if(newSt) co.prepLog.push({lbl,st:newSt,by:co.prepBy,at:ts});
  co.prepCheckedBy[co.prepBy]=(co.prepCheckedBy[co.prepBy]||0)+1;
  const s=document.getElementById('cos');
  if(s){
    // Save existing signature before redraw
    const existingSig = hasSig('co-p-sig') ? getSig('co-p-sig') : null;
    s.innerHTML=coStep0();
    setTimeout(()=>{
      initSig('co-p-sig');
      // Restore signature after redraw
      if(existingSig && sigs['co-p-sig']){
        const cv=document.getElementById('co-p-sig');
        if(cv){
          const img=new Image();
          img.onload=()=>{sigs['co-p-sig'].ctx.drawImage(img,0,0,cv.offsetWidth,cv.offsetHeight);sigs['co-p-sig'].hasData=true;};
          img.src=existingSig;
        }
      }
    },60);
  }
}

function signPrep(){
  const domVal = document.getElementById('co-p-nm')?.value;
  if(domVal) co.prepBy = domVal;
  if(!co.prepBy){
    try{
      const raw=localStorage.getItem('inprogress_'+co.fn);
      if(raw){const rec=JSON.parse(raw);co.prepBy=rec.staff||'';}
    }catch(e){}
  }
  if(!co.prepBy){toast('Select your name first','err');return;}
  if(!hasSig('co-p-sig')){toast('Sign below to confirm','err');return;}
  co.prepSig=getSig('co-p-sig');co.prepAt=now();
  // Record all staff who participated
  const allStaff=Object.keys(co.prepCheckedBy||{});
  if(!allStaff.includes(co.prepBy)) allStaff.push(co.prepBy);
  co.prepByAll=allStaff; // save for management summary
  uploadPhotos(co.prepPhotos,co.fn,co.clientName||co.v.cl,'prep');
  toast('Step 1 signed ✅','ok');drawCO();
}

// ═══════════════════════════════════════════════════════════════
//  PASSPORT OCR — reads name, DOB, nationality, passport# from photo
//  Uses Anthropic API via claude-sonnet-4-6
// ═══════════════════════════════════════════════════════════════
async function extractPassportData(b64DataUrl, driverIdx){
  // Show subtle loading indicator on the card
  toast('📷 Reading passport…','');

  try {
    // Strip the data URL prefix to get raw base64
    const base64 = b64DataUrl.split(',')[1];
    const mediaType = b64DataUrl.split(';')[0].split(':')[1] || 'image/jpeg';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 400,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: mediaType, data: base64 }
            },
            {
              type: 'text',
              text: `This is a passport photo page. Extract the following fields and return ONLY a valid JSON object, nothing else, no markdown, no explanation:
{
  "full_name": "surname and given names exactly as printed (NOT from MRZ)",
  "dob": "date of birth in DD/MM/YYYY format",
  "nationality": "nationality as printed",
  "passport_number": "passport number",
  "expiry": "expiry date in DD/MM/YYYY format"
}
If a field is not visible or unclear, use an empty string. Return only the JSON.`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    if(!data.content || !data.content[0]) throw new Error('No response');

    const raw = data.content[0].text.trim();
    // Strip any accidental markdown fences
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);

    const d = co.drivers[driverIdx];
    if(!d) return;

    let changed = [];

    if(parsed.full_name && !d.name){
      d.name = parsed.full_name;
      if(driverIdx === 0) co.clientName = parsed.full_name;
      changed.push('name');
    }
    if(parsed.dob && !d.dob){ d.dob = parsed.dob; changed.push('DOB'); }
    if(parsed.nationality && !d.nationality){ d.nationality = parsed.nationality; changed.push('nationality'); }
    if(parsed.passport_number && !d.passport){ d.passport = parsed.passport_number; changed.push('passport #'); }
    if(parsed.expiry && !d.licExpiry){ /* don't overwrite licence expiry with passport expiry */ }

    if(changed.length){
      toast(`✅ Read from passport: ${changed.join(', ')}`,'ok');
    } else if(d.name) {
      toast('Passport read — details already filled','ok');
    } else {
      toast('⚠ Could not read passport — fill in manually','err');
    }

    // Redraw the step to show filled fields
    const s = document.getElementById('cos');
    if(s) s.innerHTML = coStep1();

  } catch(err){
    console.error('Passport OCR error:', err);
    // Silently fail — staff can fill in manually
    if(err.message && err.message.includes('JSON')){
      toast('⚠ Passport unclear — fill in manually','err');
    } else {
      toast('⚠ Could not read passport — fill in manually','err');
    }
  }
}


// ═══════════════════════════════════════════════════════════════
//  LICENCE OCR — reads name, licence number, expiry from photo
// ═══════════════════════════════════════════════════════════════
async function extractLicenceData(b64DataUrl, driverIdx){
  toast('📷 Reading licence…','');
  try {
    const base64 = b64DataUrl.split(',')[1];
    const mediaType = b64DataUrl.split(';')[0].split(':')[1] || 'image/jpeg';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
            { type: 'text', text: `This is a driver's licence. Extract the following and return ONLY valid JSON, nothing else:
{
  "full_name": "full name as printed on the licence",
  "licence_number": "licence number / ID number",
  "expiry": "expiry date in DD/MM/YYYY format",
  "date_of_birth": "date of birth in DD/MM/YYYY format if visible",
  "nationality": "country of issue if visible"
}
If a field is not visible, use an empty string. Return only the JSON.` }
          ]
        }]
      })
    });

    const data = await response.json();
    if(!data.content || !data.content[0]) throw new Error('No response');
    const raw = data.content[0].text.trim().replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(raw);

    const d = co.drivers[driverIdx];
    if(!d) return;

    let changed = [];
    if(parsed.full_name && !d.name){ d.name=parsed.full_name; if(driverIdx===0) co.clientName=parsed.full_name; changed.push('name'); }
    if(parsed.licence_number && !d.licNo){ d.licNo=parsed.licence_number; changed.push('licence #'); }
    if(parsed.expiry && !d.licExpiry){ d.licExpiry=parsed.expiry; changed.push('expiry'); }
    if(parsed.date_of_birth && !d.dob){ d.dob=parsed.date_of_birth; changed.push('DOB'); }
    if(parsed.nationality && !d.nationality){ d.nationality=parsed.nationality; changed.push('nationality'); }

    if(changed.length) toast(`✅ Read from licence: ${changed.join(', ')}`,'ok');
    else toast('Licence read — details already filled','ok');

    const s=document.getElementById('cos'); if(s) s.innerHTML=coStep1();
  } catch(err){
    console.error('Licence OCR error:', err);
    toast('⚠ Could not read licence — fill in manually','err');
  }
}

async function captureDriverDoc(event,driverIdx,field){
  const file=event.target.files[0];if(!file)return;
  banner('Processing photo...');
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=async()=>{
    const scale=Math.min(1400/img.width,1);
    const cv=document.createElement('canvas');
    cv.width=img.width*scale;cv.height=img.height*scale;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const b64=cv.toDataURL('image/jpeg',0.90);
    URL.revokeObjectURL(url);
    co.drivers[driverIdx][field]=b64;
    // Keep legacy top-level refs for primary driver
    if(driverIdx===0){
      if(field==='passportImg'){co.clientPassport=b64;}
      if(field==='licFront'){co.licFront=b64;}
      if(field==='licBack'){co.licBack=b64;}
    }
    // Upload to Supabase storage
    const driverName=(co.drivers[driverIdx].name||`driver_${driverIdx}`).replace(/[^a-zA-Z0-9]/g,'_');
    const path=`clients/${driverName}/${field}_${Date.now()}.jpg`;
    const blob=await(await fetch(b64)).blob();
    const{error}=await SB.storage.from('client-docs').upload(path,blob,{contentType:'image/jpeg',upsert:true});
    hideBanner();
    if(error)toast('Upload failed: '+error.message,'err');
    else toast('Photo saved ✅','ok');
    // Auto-read documents
    if(field==='passportImg'){
      const s=document.getElementById('cos');if(s)s.innerHTML=coStep1();
      extractPassportData(b64,driverIdx);
    } else if(field==='licFront'){
      const s=document.getElementById('cos');if(s)s.innerHTML=coStep1();
      extractLicenceData(b64,driverIdx);
    } else {
      const s=document.getElementById('cos');if(s)s.innerHTML=coStep1();
    }
  };
  img.onerror=()=>{hideBanner();toast('Could not read image','err');};
  img.src=url;
}

function clrContractSig(){ window._ctClr&&window._ctClr(); }

async function submitContractSig(){

  const expectedName=(co.contract?.client_name||co.clientName||'').trim();
  const nameOk=typedName.toLowerCase()===expectedName.toLowerCase();

  if(!typedName){
    nameInput.style.border='2px solid #e74c3c';
    nameInput.placeholder='⚠ Please type your full name first';
    setTimeout(()=>{nameInput.style.border='2px solid #1e8449';nameInput.placeholder='Type your full name exactly as on your passport';},2500);
    return;
  }
  if(!nameOk){
    nameInput.style.border='2px solid #e74c3c';
    document.getElementById('ct-name-match').textContent='⚠ Name does not match — must match exactly: '+expectedName;
    document.getElementById('ct-name-match').style.color='#c0392b';
    setTimeout(()=>{nameInput.style.border='2px solid #1e8449';},2500);
    return;
  }
  if(!window._ctHasSig||!window._ctHasSig()){
    const cv=document.getElementById('ct-sig-canvas');
    if(cv){cv.style.outline='3px solid #e74c3c';setTimeout(()=>cv.style.outline='',1200);}
    const btn=document.getElementById('ct-sign-btn');

    return;
  }
  // Store the typed name for the contract record
  co.contract=co.contract||{};
  co.contract.client_name_confirmed=typedName;
  const sigData=window._ctGetSig();
  document.getElementById('contract-modal').remove();
  await signContract(sigData);
}

  banner('Saving signed contract...');
  // Build final HTML
  const finalHTML=buildContractHTML(co.contract,sigData);
  co.contract.contract_html=finalHTML;
  // Upload sig
  const sigBlob=await(await fetch(sigData)).blob();
  const cln=(co.clientName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
  const sigPath=`clients/${cln}/contracts/sig_${co.fn}_${Date.now()}.png`;
  const{data:sigUrl}=await SB.storage.from('client-docs').upload(sigPath,sigBlob,{contentType:'image/png',upsert:true}).then(()=>SB.storage.from('client-docs').getPublicUrl(sigPath));
  if(sigUrl)co.contract.client_sig_url=sigUrl.publicUrl;
  // Save to DB
  const{error}=await SB.from('rental_contracts').insert({
    ...co.contract,contract_html:finalHTML,
    booking_id:co.fn+'_'+co.v.pu,created_by:currentProfile?.name||'staff',
    created_at:new Date().toISOString(),updated_at:new Date().toISOString(),
  });
  hideBanner();
  if(error)toast('DB save failed: '+error.message,'err');
  else toast('Contract signed & saved ✅','ok');
  // Show email modal — office staff confirms/types address then sends
  setTimeout(()=>showEmailModal(co.contract, finalHTML), 400);
  drawCO();
}

const OFFICE_EMAIL = 'info@gorent4x4.com';  // office always gets BCC

async function sendContractEmail(toEmail, c, contractHtml){
  try{
    const resp = await fetch('https://rfzcemsyrcntsunbdvdh.supabase.co/functions/v1/send-contract-email',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${SB_KEY}`},
      body:JSON.stringify({
        to: toEmail,
        bcc: OFFICE_EMAIL,
        client_name: c.client_name,
        fleet_no: c.fleet_no,
        pickup_date: c.pickup_date,
        return_date: c.return_date,
        contract_html: contractHtml,
        sig_url: c.client_sig_url||'',
      }),
    });
    const result = await resp.json().catch(()=>({}));
    return resp.ok || result.success;
  } catch(e){
    console.error('Email send error:',e);
    return false;
  }
}

async function doSendContractEmails(){
  const modal = document.getElementById('email-modal');
  if(!modal) return;
  const c = modal._contract;
  const contractHtml = modal._html;

  const clientEmail = document.getElementById('em-client').value.trim();
  const officeEmail = document.getElementById('em-office').value.trim();
  const status = document.getElementById('em-status');
  const btn = document.getElementById('em-send-btn');

  if(!clientEmail || !clientEmail.includes('@')){
    document.getElementById('em-client').style.borderColor='var(--re)';
    document.getElementById('em-client').focus();
    if(status) status.innerHTML = '<div style="color:var(--rl);font-size:12px;">⚠ Enter a valid client email address</div>';
    return;
  }

  btn.textContent = '⏳ Sending…';
  btn.disabled = true;
  if(status) status.innerHTML = '<div style="color:var(--g5);font-size:12px;">Sending to client…</div>';

  // Save email back to co for future use
  co.clientEmail = clientEmail;
  if(co.drivers&&co.drivers[0]) co.drivers[0].email = clientEmail;

  // Send to client (office BCC'd via edge function)
  const ok = await sendContractEmail(clientEmail, c, contractHtml);

  if(ok){
    // Update DB record with sent email
    if(c.id){
      await SB.from('rental_contracts')
        .update({email_sent_at:new Date().toISOString(), email_sent_to:clientEmail, updated_at:new Date().toISOString()})
        .eq('id', c.id);
    }
    if(status) status.innerHTML = `
      <div style="background:var(--sg);border:1px solid var(--gb);border-radius:8px;padding:10px 12px;font-size:12px;">
        ✅ Contract sent to <strong style="color:var(--se)">${clientEmail}</strong><br>
        📋 Office copy BCC'd to <strong style="color:var(--se)">${officeEmail}</strong>
      </div>`;
    btn.textContent = '✅ Sent';
    btn.style.background = 'var(--g3)';
    btn.style.color = 'var(--g5)';
    setTimeout(()=>modal.remove(), 2500);
  } else {
    if(status) status.innerHTML = '<div style="color:var(--rl);font-size:12px;">⚠ Send failed — check internet connection or Resend API key in Supabase</div>';
    btn.textContent = '📧 Retry';
    btn.disabled = false;
  }
}

function signMgmt(){

  if(!hasSig('co-m-sig')){toast('Manager must sign','err');return;}
  co.mgmtSig=getSig('co-m-sig');co.mgmtAt=now();
  toast('Vehicle cleared ✅','ok');drawCO();
}

function startCI(fn){
  const v=FLEET.find(x=>x.fn===fn);if(!v||v.st!=='rented'){toast('Not on rent','err');return;}
  // Mark as in-progress (preserve existing staff if already set)
  try{
    const existing=localStorage.getItem('inprogress_'+fn);
    const prev=existing?JSON.parse(existing):{};
    localStorage.setItem('inprogress_'+fn, JSON.stringify({
      type:'checkin',fn,cl:v.cl,
      started:prev.started||new Date().toISOString(),
      staff:prev.staff||'',
      staffLocked:prev.staffLocked||false
    }));
    // Restore staff name
    if(prev.staff){ci.receivedBy=prev.staff;}
  }catch(e){}
  RET_GROUPS.forEach(g=>g.items.forEach(i=>{retSt[i]='ok';}));
  ci={v,fn,receivedBy:'',odoIn:v.odo+1200,odometerOut:co?.odometerOut||v.odo,fuelIn:'Full',notes:'',
      dmgd:[],dmgPhotos:[],custSig:null,custAt:'',
      mgmtName:'',mgmtSig:null,mgmtAt:'',deposit:'Full deposit returned',mgmtNotes:'',
      retItems:{},retSig:null,retAt:''};
  ciStep=0;
  initIM();
  (v.dmgd||[]).forEach(d=>{(d.cells||[]).forEach(c=>{imarks[d.view]?.['M']&&(imarks[d.view]['M'][c.r+','+c.c]='pr');});});
  goPage('ci');drawCI();
}

function drawCI(){
  const r=ci,v=r.v;
  // Compute issues for step progress
  const allItems=RET_GROUPS.flatMap(g=>g.items);
  const missing=allItems.filter(i=>retSt[i]==='missing');
  const damaged=allItems.filter(i=>retSt[i]==='dmg');
  ci.dmgd=getDmgData();
  const newDmg=ci.dmgd.filter(d=>d.types?.some(t=>t!=='pr'));
  const fuelShort=r.fuelIn!==v.fuelOut;
  const hasIssues=newDmg.length||fuelShort||missing.length||damaged.length;
  const km=r.odoIn-(ci.odometerOut||v.odo);

  const CI_STEPS=[
    {n:0,ico:'🧹',lbl:'Vehicle Check',sub:'Checklist & fuel'},
    {n:1,ico:'🔍',lbl:'Damage',sub:'Inspect body'},
    {n:2,ico:'🏕',lbl:'Equipment',sub:'All items back'},
    {n:3,ico:'✍️',lbl:'Customer',sub:'Client signs'},
    {n:4,ico:'👔',lbl:'Management',sub:'Close rental'},
  ];

  const bar=CI_STEPS.map(s=>{
    const done=(s.n===0&&!!r.retSig)||(s.n===1&&!!r.dmgPhotos?.length)||(s.n===2&&allItems.every(i=>retSt[i]&&retSt[i]!==''))||(s.n===3&&!!r.custSig)||(s.n===4&&!!r.mgmtSig);
    const active=s.n===ciStep;
    return `<div class="stg ${active?'active':done?'done':''}" onclick="ciStep=${s.n};drawCI()">
      <div style="font-size:16px">${done&&!active?'✅':s.ico}</div>
      <div style="font-size:9px;margin-top:2px">${s.lbl}</div>
    </div>`;
  }).join('');

  const bodyHTML=ciStep===0?ciStep0_CI():ciStep===1?ciStep1_CI():ciStep===2?ciStep2_CI():ciStep===3?ciStep3_CI():ciStep4_CI();

  document.getElementById('ci-body').innerHTML=`
    <div class="fhdr">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="fhdr-fn">${r.fn} <span>${v.reg}</span></div>
          <div class="fhdr-cl">${v.cl} · Return: ${v.rt}</div>
        </div>
        <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;background:rgba(240,80,80,.15);color:var(--rl);border:1px solid var(--re)">◀ ARRIVAL</span>
      </div>
    </div>
    <div class="stg-bar s5">${bar}</div>
    <div id="ci-step-body">${bodyHTML}</div>
    <div class="btn-row">
      ${ciStep>0?`<button class="btn s" style="flex:1" onclick="ciStep=Math.max(0,ciStep-1);drawCI()">← Back</button>`:''}
      ${ciStep<4?`<button class="btn g" style="flex:2" onclick="ciStep=Math.min(4,ciStep+1);drawCI()">Next →</button>`:''}
    </div>`;

  setTimeout(()=>{
    VIEWS.forEach(v=>buildIG(v));renderIS();
    ['ci-ret-sig','ci-c-sig','ci-m-sig'].forEach(initSig);
  },100);
}

        ${['Full','3/4','1/2','1/4','Empty'].map(f=>`<option${r.fuelIn===f?' selected':''}>${f}</option>`).join('')}
      </select>

    ${pct===100?'<span style="color:var(--se);font-weight:700;margin-left:8px">✅ All done!</span>':''}</div>
  </div>

function tapRetItem(i){
  const nm=document.getElementById('ci-rcv')?.value;if(nm)ci.receivedBy=nm;
  if(!ci.receivedBy){toast('Select your name first','err');return;}
  if(L_PREP[i][0]==='__SECTION__'||L_PREP[i][0]==='__OPTIONAL__')return;
  if(L_PREP[i][1]?.startsWith('__QTY__'))return;
  const lbl=L_PREP[i][1];
  const isOpt=L_PREP[i][0]==='__OPT_ITEM__';
  const prevSt=(ci.retItems[lbl]?.st)||ci.retItems[lbl]||'';
  let newSt;
  if(isOpt) newSt=prevSt===''?'ok':prevSt==='ok'?'prob':prevSt==='prob'?'na':'';
  else newSt=prevSt===''?'ok':prevSt==='ok'?'prob':'';
  const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  ci.retItems[lbl]={st:newSt,by:ci.receivedBy,at:ts};
  if(!ci.retLog) ci.retLog=[];
  if(!ci.retCheckedBy) ci.retCheckedBy={};
  if(newSt) ci.retLog.push({lbl,st:newSt,by:ci.receivedBy,at:ts});
  ci.retCheckedBy[ci.receivedBy]=(ci.retCheckedBy[ci.receivedBy]||0)+1;
  const s=document.getElementById('ci-step-body');
  if(s){
    const existingSig=hasSig('ci-ret-sig')?getSig('ci-ret-sig'):null;
    s.innerHTML=ciStep0_CI();
    setTimeout(()=>{
      initSig('ci-ret-sig');
      if(existingSig&&sigs['ci-ret-sig']){
        const cv=document.getElementById('ci-ret-sig');
        if(cv){const img=new Image();img.onload=()=>{sigs['ci-ret-sig'].ctx.drawImage(img,0,0,cv.offsetWidth,cv.offsetHeight);sigs['ci-ret-sig'].hasData=true;};img.src=existingSig;}
      }
    },60);
  }
}

function signRetCheck(){
  const domVal=document.getElementById('ci-rcv')?.value;if(domVal)ci.receivedBy=domVal;
  if(!ci.receivedBy){toast('Select your name first','err');return;}
  if(!hasSig('ci-ret-sig')){toast('Sign below to confirm','err');return;}
  ci.odoIn=+document.getElementById('ci-odo')?.value||ci.odoIn;
  ci.fuelIn=document.getElementById('ci-fuel')?.value||ci.fuelIn;
  ci.retSig=getSig('ci-ret-sig');ci.retAt=now();
  try{
    const raw=localStorage.getItem('inprogress_'+ci.fn);
    if(raw){const rec=JSON.parse(raw);rec.staff=ci.receivedBy;rec.staffLocked=true;localStorage.setItem('inprogress_'+ci.fn,JSON.stringify(rec));}
  }catch(e){}
  toast('Step 1 signed ✅','ok');ciStep=1;drawCI();
}

async function signCustCI(){
  if(!ci.receivedBy){toast('Select who received the vehicle first','err');ciStep=0;drawCI();return;}
  if(!hasSig('ci-c-sig')){toast('Customer must sign','err');return;}
  ci.notes=document.getElementById('ci-notes')?.value||ci.notes;
  ci.custSig=getSig('ci-c-sig');ci.custAt=now();
  uploadPhotos(ci.dmgPhotos,ci.fn,ci.v.cl,'damage-in');
  // Send management alert if issues
  const allItems=RET_GROUPS.flatMap(g=>g.items);
  const missing=allItems.filter(i=>retSt[i]==='missing');
  const damaged=allItems.filter(i=>retSt[i]==='dmg');
  const newDmg=ci.dmgd.filter(d=>d.types?.some(t=>t!=='pr'));
  const fuelShort=ci.fuelIn!==ci.v.fuelOut;
  if(newDmg.length||fuelShort||missing.length||damaged.length){
    SB.from('management_alerts').insert({
      fleet_no:ci.fn,client:ci.v.cl,received_by:ci.receivedBy,
      new_damage:newDmg.length>0,fuel_short:fuelShort,
      missing_items:missing,damaged_items:damaged,
      message:`RETURN ISSUE — ${ci.fn}/${ci.v.cl}: ${[newDmg.length?'New damage':'',fuelShort?'Fuel short':'',missing.length?'Missing items':''].filter(Boolean).join(', ')}`,
      created_at:new Date().toISOString(),
    });
    toast('⚠ Management alerted','err');
  } else {
    toast('Customer signed ✅','ok');
  }
  drawCI();
}

async function signMgmtCI(){
  ci.mgmtName=document.getElementById('ci-mgmt')?.value.trim()||ci.mgmtName;
  ci.deposit=document.getElementById('ci-dep')?.value||ci.deposit;
  ci.mgmtNotes=document.getElementById('ci-mnotes')?.value||ci.mgmtNotes;
  if(!ci.mgmtName){toast('Enter manager name','err');return;}
  if(!hasSig('ci-m-sig')){toast('Manager must sign','err');return;}
  ci.mgmtSig=getSig('ci-m-sig');ci.mgmtAt=now();
  toast('Rental closed ✅','ok');drawCI();
}

async function completeCI(){
  try{localStorage.removeItem('inprogress_'+ci.fn);}catch(e){}
  const newDmg=ci.dmgd.filter(d=>d.types?.some(t=>t!=='pr'));
  ci.v.st=newDmg.length?'maintenance':'available';
  const allItems=RET_GROUPS.flatMap(g=>g.items);
  const missing=allItems.filter(i=>retSt[i]==='missing');
  const damaged=allItems.filter(i=>retSt[i]==='dmg');
  await SB.from('checkins').insert({
    booking_id:ci.fn+'_'+ci.v.pu,fleet_no:ci.fn,client:ci.v.cl,
    received_by:ci.receivedBy,odo_in:ci.odoIn,odo_out:ci.v.odo,
    km_driven:ci.odoIn-ci.v.odo,fuel_in:ci.fuelIn,fuel_out:ci.v.fuelOut,
    fuel_short:ci.fuelIn!==ci.v.fuelOut,new_damage:newDmg.length>0,
    new_damage_panels:newDmg,equipment_status:retSt,
    missing_items:missing,damaged_items:damaged,
    customer_signed_at:ci.custSig?new Date().toISOString():null,
    manager_name:ci.mgmtName,manager_signed_at:ci.mgmtSig?new Date().toISOString():null,
    deposit_decision:ci.deposit,manager_notes:ci.mgmtNotes,client_notes:ci.notes,
    created_at:new Date().toISOString(),
  });
  await SB.from('vehicles').update({odo:ci.odoIn,status:ci.v.st,updated_at:new Date().toISOString()}).eq('fleet_no',ci.fn);
  const hasIssues=newDmg.length||(ci.fuelIn!==ci.v.fuelOut)||missing.length||damaged.length;
  document.getElementById('ci-body').innerHTML=`
    <div class="done"><div class="done-ico">${hasIssues?'⚠️':'✅'}</div>
      <div class="done-title">Return Complete</div>
      <div class="done-sub">${ci.fn} · ${ci.v.cl}<br>${(ci.odoIn-ci.v.odo).toLocaleString()} km · Received by ${ci.receivedBy}</div>
    </div>
    ${hasIssues?`<div style="background:var(--rg);border:2px solid var(--re);border-radius:var(--r);padding:14px;margin-bottom:12px">
      <div style="font-size:14px;font-weight:800;color:var(--rl);margin-bottom:8px">💰 Recover from ${ci.v.cl}</div>
      ${newDmg.length?`<div style="font-size:12px;color:var(--rl);padding:4px 0">🔴 Damage repair: ${newDmg.map(d=>d.view_name).join(', ')}</div>`:''}
      ${ci.fuelIn!==ci.v.fuelOut?`<div style="font-size:12px;color:var(--al);padding:4px 0">⛽ Fuel: ${ci.v.fuelOut||'Full'} out → ${ci.fuelIn} in</div>`:''}
      ${missing.length?`<div style="font-size:12px;color:var(--rl);padding:4px 0">❌ Replace: ${missing.join(', ')}</div>`:''}
      <div style="font-size:10px;color:var(--am);margin-top:8px">📷 ${ci.dmgPhotos?.length||0} damage photos · Signed contract on file · Management alerted</div>
    </div>`:'<div class="al ok" style="margin-bottom:12px">✅ Clean return — full deposit released</div>'}
    <div class="al ${ci.v.st==='maintenance'?'warn':'ok'}">
      ${ci.v.st==='maintenance'?'⚠ Vehicle flagged for maintenance before next rental':'✓ Vehicle back in available fleet'}
    </div>
    <button class="btn g" style="margin-top:10px" onclick="goPage('ov')">← Back to Overview</button>`;
  renderOV();
}

function rpTab(btn,id){

function rpFleet(){
  return FLEET.map(v=>{
    const svcLeft=v.svc?(v.svc.lastKm+v.svc.intKm)-v.odo:null;
    const licDays=v.lic?Math.round((new Date(v.lic.expiry)-new Date('2026-07-15'))/86400000):null;
    const tyrLeft=v.tyres?(v.tyres.lastKm+v.tyres.intKm)-v.odo:null;
    const crit=(svcLeft!==null&&svcLeft<=0)||(licDays!==null&&licDays<=30)||(tyrLeft!==null&&tyrLeft<=0);
    const warn=(svcLeft!==null&&svcLeft<=1500)||(licDays!==null&&licDays<=90)||(tyrLeft!==null&&tyrLeft<=3000);
    return `<div class="rpt-card" style="border-color:${crit?'var(--re)':warn?'var(--am)':'var(--g2)'};${crit?'animation:pulse 1.5s infinite':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="rpt-fn">${v.fn} <span style="font-size:12px;font-weight:400;color:var(--g5)">${v.reg}</span></div>
          <div class="rpt-cl">${v.st==='rented'?`On road with ${v.cl} · back ${v.rt}`:'Available'}</div>
          <div class="rpt-meta">Odo: ${v.odo.toLocaleString()} km</div>
        </div>
        <span class="bdg ${v.st==='rented'?'b':v.blocked?'r':'g'}">${v.st==='rented'?'Out':v.blocked?'Blocked':'OK'}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px">
        ${[['🔧','Service',svcLeft!==null?svcLeft<=0?`OVERDUE ${Math.abs(svcLeft).toLocaleString()}km`:'+'+svcLeft.toLocaleString()+'km':'—',svcLeft<=0?'crit':svcLeft<=1500?'warn':'ok'],
           ['📋','Licence',licDays!==null?licDays+'d':'—',licDays<=30?'crit':licDays<=90?'warn':'ok'],
           ['🛞','Tyres',tyrLeft!==null?tyrLeft<=0?'OVERDUE':'+'+tyrLeft.toLocaleString()+'km':'—',tyrLeft<=0?'crit':tyrLeft<=3000?'warn':'ok'],
        ].map(([i,l,val,st])=>`<div style="background:var(--g2);border-radius:7px;padding:7px;text-align:center">
          <div>${i}</div><div style="font-size:9px;color:var(--g5);margin:2px 0;text-transform:uppercase">${l}</div>
          <div style="font-size:11px;font-weight:700;color:${st==='crit'?'var(--rl)':st==='warn'?'var(--al)':'var(--se)'}">${val}</div>
        </div>`).join('')}
      </div>
      ${v.blocked?`<div class="al warn" style="margin-top:8px;font-size:10px">⚠ ${v.blocked}</div>`:''}
    </div>`;
  }).join('');
}
async function loadHistory(){
  const el=document.getElementById('rp-history');
  if(!el)return;
  el.innerHTML='<div style="color:var(--g5);padding:20px;text-align:center">Loading activity log...</div>';

  const q=(document.getElementById('rp-q')?.value||'').toLowerCase();
  const filter=document.getElementById('rp-filter')?.value||'all';
  const person=document.getElementById('rp-person')?.value||'all';

  const [{data:cos},{data:cis}]=await Promise.all([
    SB.from('checkouts').select('*').order('created_at',{ascending:false}).limit(100),
    SB.from('checkins').select('*').order('created_at',{ascending:false}).limit(100),

  let records=[

function selStaff(id,list,val){
  // If already locked in localStorage, show locked state
  const fn = co.fn||ci.fn||'';
  let lockedStaff = '';
  try{
    const raw = localStorage.getItem('inprogress_'+fn);
    if(raw){ const rec=JSON.parse(raw); lockedStaff=rec.staff||''; }
  }catch(e){}

  // If locked and value matches, show locked display with unlock option
  if(lockedStaff && val && lockedStaff===val){
    return `<div style="background:var(--g0);border:2px solid var(--am);border-radius:var(--rs);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--am);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#000;">${val.slice(0,2).toUpperCase()}</div>
        <div>
          <div style="font-size:15px;font-weight:800;color:var(--al);">${val}</div>
          <div style="font-size:10px;color:var(--g5);">🔒 Locked — started this process</div>
        </div>
      </div>
      <button onclick="unlockStaff('${id}','${fn}')" style="background:var(--g2);border:1px solid var(--g3);border-radius:6px;color:var(--g5);font-size:10px;font-weight:700;padding:5px 10px;cursor:pointer;">🔓 Change</button>
    </div>`;
  }

  // Otherwise show dropdown
  return `<select id="${id}" style="color-scheme:dark;font-size:16px;padding:12px;font-weight:700;color:var(--al)" onchange="
    if('${id}'==='co-p-nm') co.prepBy=this.value;
    else if('${id}'==='co-h-nm') co.mechBy=this.value;
    else if('${id}'==='ci-rcv') ci.receivedBy=this.value;
    try{
      const fn=co.fn||ci.fn||'';
      const raw=localStorage.getItem('inprogress_'+fn);
      if(raw){const rec=JSON.parse(raw);rec.staff=this.value;rec.staffLocked=true;localStorage.setItem('inprogress_'+fn,JSON.stringify(rec));}
    }catch(e){}
    // Redraw to show locked state
    if(document.getElementById('page-co').classList.contains('on')) drawCO();
    else drawCI();
  ">
    <option value="">— select your name —</option>
    ${list.map(n=>`<option value="${n}"${n===val?' selected':''}>${n}</option>`).join('')}
  </select>`;
}

function unlockStaff(id, fn){
  // Clear the lock so they can re-select
  try{
    const raw=localStorage.getItem('inprogress_'+fn);
    if(raw){const rec=JSON.parse(raw);rec.staffLocked=false;rec.staff='';localStorage.setItem('inprogress_'+fn,JSON.stringify(rec));}
  }catch(e){}
  // Clear the co/ci value
  if(id==='co-p-nm') co.prepBy='';
  else if(id==='co-h-nm') co.mechBy='';
  else if(id==='ci-rcv') ci.receivedBy='';
  if(document.getElementById('page-co').classList.contains('on')) drawCO();
  else drawCI();
}
function licDiscBanner(v, context){
  if(!v) return '';
  // Use overridden expiry if staff has entered one, else fleet default
  const expiry = (v._licExpiry||'') || (v.lic?.expiry||'');
  const today = new Date('2026-07-15');

  let statusHTML = '';
  if(expiry){
    const exp = new Date(expiry+'T00:00:00');
    const daysLeft = Math.round((exp-today)/86400000);
    const expired = daysLeft<0;
    const warn = daysLeft>=0&&daysLeft<=45;
    const ok = daysLeft>45;
    if(context==='in'&&ok) statusHTML=''; // check-in: only banner if problem
    else {
      const label = expired?'EXPIRED':'expires '+exp.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      const bg = expired?'var(--rg)':warn?'var(--ag)':'var(--sg)';
      const border = expired?'var(--re)':warn?'var(--am)':'var(--gb)';
      const col = expired?'var(--rl)':warn?'var(--al)':'var(--se)';
      const icon = expired?'❌':warn?'⚠️':'✅';
      const sub = expired
        ?(context==='out'?'⛔ DO NOT CHECK OUT — report to management immediately.':'Notify management immediately.')
        :('Expires in '+daysLeft+' day'+(daysLeft!==1?'s':'')+' — notify management'+(context==='out'?' before departure.':'.'));
      const sub2 = ok?'Valid for '+daysLeft+' more day'+(daysLeft!==1?'s':''):'';
      statusHTML = '<div style="background:'+bg+';border:1px solid '+border+';border-radius:6px;padding:7px 10px;margin-top:6px;display:flex;align-items:center;gap:8px;">'
        +'<span style="font-size:18px;">'+icon+'</span>'
        +'<div><div style="font-size:12px;font-weight:800;color:'+col+';">'+label+'</div>'
        +(expired||warn?'<div style="font-size:10px;color:'+col+';margin-top:1px;">'+sub+'</div>':'')
        +(ok&&context==='out'?'<div style="font-size:10px;color:'+col+';margin-top:1px;">'+sub2+'</div>':'')
        +'</div></div>';
    }
  }

  // Editable licence disc section
  const obj = context==='out'?'co.v':'ci.v';
  const fnRef = context==='out'?'co.fn':'ci.fn';
  const inputId = 'lic-expiry-'+context;

  return '<div style="background:var(--g1);border:2px solid var(--g3);border-radius:var(--rs);padding:10px 14px;margin-bottom:10px;">'
    +'<div style="font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;">📋 Licence Disc</div>'
    +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<div style="flex:1;">'
        +'<label style="font-size:10px;font-weight:700;color:var(--g5);text-transform:uppercase;display:block;margin-bottom:4px;">Expiry Date</label>'
        +'<input type="date" id="'+inputId+'" value="'+(expiry||'')+'"'
          +' oninput="'+obj+'._licExpiry=this.value;'
            +'const b=document.getElementById(\'lic-banner-'+context+'\');'
            +'if(b)b.innerHTML=licDiscBanner('+obj+',\''+context+'\');"'
          +' style="color-scheme:dark;padding:10px 12px;font-size:14px;font-weight:700;background:var(--g0);border:2px solid '+(expiry?'var(--gb)':'var(--re)')+';border-radius:var(--rs);color:var(--tx);width:100%;">'
      +'</div>'
      +'<button onclick="saveLicExpiry(\''+fnRef+'\',document.getElementById(\''+inputId+'\').value,\''+context+'\')" '
        +'style="padding:10px 14px;background:var(--sg);border:2px solid var(--gb);border-radius:var(--rs);color:var(--se);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">'
        +'💾 Save'
      +'</button>'
    +'</div>'
    +(statusHTML?statusHTML:'<div style="font-size:10px;color:var(--al);margin-top:6px;">⚠ Enter licence disc expiry date above</div>')
  +'</div>';
}

async function saveLicExpiry(fn, expiry, context){
  if(!expiry){toast('Enter expiry date first','err');return;}
  const v=(context==='out'?co.v:ci.v);
  v._licExpiry=expiry;
  v.lic=v.lic||{};
  v.lic.expiry=expiry;
  // Save to Supabase vehicles table
  try{
    await SB.from('vehicles').update({lic_expiry:expiry,updated_at:new Date().toISOString()}).eq('fleet_no',fn);
    toast('Licence disc saved ✅','ok');
  }catch(e){
    toast('Saved locally — DB update pending','ok');
  }
  // Redraw to reflect new status
  if(context==='out') drawCO(); else drawCI();
}
